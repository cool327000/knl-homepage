<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경기일정 · 결과 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.schedule-wrap{background:linear-gradient(135deg,#fff,#f7f9fc);border:1px solid #dce3ec;border-radius:22px;padding:26px;min-height:620px}.schedule-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.schedule-head h1{margin:0;font-size:32px;color:#1c2b3d}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{padding:13px 24px;border:1px solid #d9e1eb;border-radius:24px;background:#fff;font-weight:800;color:#738093;cursor:pointer}.tab.active{background:#24364d;color:#fff;border-color:#24364d}.controls{display:flex;gap:8px;align-items:center;margin-bottom:15px;padding:10px 14px;width:max-content;background:#f4f7fa;border:1px solid #d8e0e9;border-radius:16px}.controls button,.controls select{height:36px;border:1px solid #ccd6e1;background:#fff;border-radius:8px;padding:0 12px;font-weight:700;color:#24364d}.schedule-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;overflow:hidden;border-radius:18px;table-layout:fixed}.schedule-table thead{background:#30415a;color:#fff}.schedule-table th{padding:15px 10px;font-weight:800}.schedule-table th:nth-child(1){width:13%}.schedule-table th:nth-child(2){width:12%}.schedule-table th:nth-child(3){width:32%}.schedule-table th:nth-child(4),.schedule-table th:nth-child(5){width:21.5%}.schedule-table td{padding:15px 10px;border-bottom:1px solid #e9edf2;text-align:center;color:#253448}.schedule-table tbody tr:last-child td{border-bottom:0}.schedule-table tbody tr:hover{background:#f7f9fc}.match-line{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;width:100%;column-gap:12px;font-weight:800;white-space:nowrap}.match-team{min-width:0;overflow:hidden;text-overflow:ellipsis}.match-team:first-child{text-align:right}.match-team:last-child{text-align:left}.match-score{padding:0 2px;text-align:center;font-weight:900;color:#163d6a;white-space:nowrap}.table-button{border:1px solid #d3dce7;background:#fff;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}.calendar-view{display:none}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e1e6ed;border:1px solid #e1e6ed;border-radius:16px;overflow:hidden}.calendar-grid>div{background:#fff;min-height:104px;padding:10px}.calendar-grid .dow{min-height:auto;text-align:center;font-weight:800;padding:9px;background:#f4f7fa}.cal-game{margin-top:9px;font-size:13px;font-weight:800;line-height:1.45}.cal-score{color:#174c7d}.cal-time{margin-top:3px;font-size:12px;color:#6d7b8c;font-weight:800}.empty{padding:60px;text-align:center;color:#7a8797;font-weight:700}@media(max-width:760px){.schedule-wrap{padding:16px;overflow:auto}.schedule-head{min-width:700px}.schedule-table{min-width:700px}.calendar-grid{min-width:700px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li class="has-dropdown"><a href="schedule.html">일정 · 결과</a><ul class="dropdown"><li><a href="schedule.html">경기일정 · 결과</a></li><li><a href="gamecenter.html">게임센터</a></li><li><a href="scoreboard.html">스코어보드</a></li></ul></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a class="active" href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html">게임센터</a><a href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content schedule-wrap"><div class="schedule-head"><h1>경기일정 · 결과</h1><div>홈 &gt; 일정 · 결과 &gt; 경기일정 · 결과</div></div><div class="tabs"><button class="tab active" data-view="list">리스트</button><button class="tab" data-view="calendar">달력</button></div><div class="controls"><button id="prev-month">&lt;</button><select id="year"><option value="2026">2026</option><option value="2025">2025</option></select><select id="month"><option value="08">08</option><option value="09">09</option></select><button id="next-month">&gt;</button></div><div id="list-view"><table class="schedule-table"><thead><tr><th>날짜</th><th>시간</th><th>경기</th><th>리뷰</th><th>하이라이트</th></tr></thead><tbody id="schedule-body"></tbody></table></div><div id="calendar-view" class="calendar-view"><div class="calendar-grid" id="calendar-grid"></div></div></section></main><script>const games=[['08.14(금)','20:30','키움','6','0','양키스','경기종료'],['08.15(토)','15:00','양키스','0','1','키움','경기종료'],['08.16(일)','15:00','키움','5','4','양키스','경기종료'],['08.17(월)','20:00','양키스','0','5','키움','경기종료'],['08.18(화)','20:00','양키스','4','6','키움','경기종료'],['08.19(수)','20:00','키움','','','양키스','경기예정'],['08.21(금)','20:30','양키스','','','키움','경기예정'],['08.22(토)','15:00','키움','','','양키스','경기예정'],['08.23(일)','15:00','양키스','','','키움','경기예정'],['08.25(화)','20:00','키움','','','양키스','경기예정'],['08.26(수)','20:00','양키스','','','키움','경기예정'],['08.28(금)','20:30','키움','','','양키스','경기예정'],['08.29(토)','15:00','양키스','','','키움','경기예정'],['08.30(일)','15:00','키움','','','양키스','경기예정']];const sept=['01','02','04','05','06','08','09','11','12','13','15','16','18','19','20','22','23'].map((d,i)=>['09.'+d+'(일)','20:00',i%2?'양키스':'키움','','',i%2?'키움':'양키스','경기예정']);const body=document.getElementById('schedule-body'),year=document.getElementById('year'),month=document.getElementById('month');function rows(){if(year.value!=='2026')return[];return month.value==='08'?games:sept}function match(r){return '<div class="match-line"><span class="match-team">'+r[2]+'</span><span class="match-score">'+(r[3]?r[3]+' : '+r[4]:'vs')+'</span><span class="match-team">'+r[5]+'</span></div>'}function renderCalendar(){const grid=document.getElementById('calendar-grid'),data=rows();grid.innerHTML=['일','월','화','수','목','금','토'].map(x=>'<div class="dow">'+x+'</div>').join('');const max=month.value==='09'?30:31,offset=month.value==='09'?2:6;for(let i=0;i<offset;i++)grid.innerHTML+='<div></div>';for(let d=1;d<=max;d++){const prefix=month.value+'.'+String(d).padStart(2,'0'),row=data.find(x=>x[0].indexOf(prefix)===0);grid.innerHTML+='<div><b>'+d+'</b>'+(row?'<div class="cal-game">'+row[2]+' '+(row[3]?'<span class="cal-score">'+row[3]+' : '+row[4]+'</span>':'vs')+' '+row[5]+'<div class="cal-time">'+row[1]+'</div></div>':'')+'</div>'}}function gameUrl(r,tab){return 'gamecenter.html?date=2026-'+month.value+'-'+r[0].slice(3,5)+'&tab='+tab}function render(){const data=rows();body.innerHTML=data.length?data.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+match(r)+'</td><td>'+(r[6]==='경기종료'?'<button class="table-button" onclick="location.href=\''+gameUrl(r,'review')+'\'">리뷰</button>':'')+'</td><td>'+(r[6]==='경기종료'?'<button class="table-button" onclick="location.href=\''+gameUrl(r,'highlight')+'\'">하이라이트</button>':'')+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">등록된 일정이 없습니다.</td></tr>';renderCalendar()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('list-view').style.display=t.dataset.view==='list'?'block':'none';document.getElementById('calendar-view').style.display=t.dataset.view==='calendar'?'block':'none'});function switchMonth(){month.value=month.value==='08'?'09':'08';render()}document.getElementById('prev-month').onclick=switchMonth;document.getElementById('next-month').onclick=switchMonth;year.onchange=render;month.onchange=render;render();</script></body></html>
