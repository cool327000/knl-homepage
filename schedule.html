<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경기일정 · 결과 - KNL 리그</title><link rel="stylesheet" href="styles.css"></head><body><main class="container page-wrap"><section class="page-content schedule-wrap"><div class="schedule-head"><h1>경기일정 · 결과</h1></div><div class="controls"><button id="prev-month">&lt;</button><select id="season"><option value="S4">S4</option><option value="S5">S5</option></select><select id="year"><option value="2026">2026</option></select><select id="month"><option value="08">08</option><option value="09">09</option></select><button id="next-month">&gt;</button></div><div id="list-view"><table class="schedule-table"><thead><tr><th>날짜</th><th>시간</th><th>경기</th><th>비고</th><th>리뷰</th><th>하이라이트</th></tr></thead><tbody id="schedule-body"></tbody></table></div></section></main><script>const icons={키움:'https://cdn.discordapp.com/emojis/1536572678968967258.webp?size=44',양키스:'https://cdn.discordapp.com/emojis/1536577218011070494.webp?size=44'};const aug=[['08.14(금)','20:30','양키스','6','0','키움','경기종료',''],['08.15(토)','15:00','키움','0','1','양키스','경기종료',''],['08.16(일)','15:00','양키스','5','4','키움','경기종료',''],['08.17(월)','20:00','키움','0','5','양키스','경기종료',''],['08.18(화)','20:00','키움','6','4','양키스','경기종료',''],['08.19(수)','20:00','키움','3','4','양키스','경기종료',''],['08.21(금)','20:00','양키스','5','1','키움','경기종료',''],['08.22(토)','16:00','키움','0','1','양키스','경기종료',''],['08.23(일)','16:00','양키스','4','7','키움','경기종료',''],['08.25(화)','20:00','키움','0','5','양키스','경기종료','']];let month=document.getElementById('month'),body=document.getElementById('schedule-body');function team(n){return '<img class="team-icon" src="'+icons[n]+'">'+n}function render(){body.innerHTML=aug.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+team(r[2])+' <b>'+r[3]+' : '+r[4]+'</b> '+team(r[5])+'</td><td>'+r[7]+'</td><td><button class="table-button">리뷰</button></td><td><button class="table-button">하이라이트</button></td></tr>').join('')}render();</script></body></html>
