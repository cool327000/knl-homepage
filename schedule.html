<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경기일정 · 결과 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.schedule-wrap{background:linear-gradient(135deg,#fff,#f7f9fc);border:1px solid #dce3ec;border-radius:22px;padding:26px;min-height:620px}.schedule-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.schedule-head h1{margin:0;font-size:32px;color:#1c2b3d}.tabs{display:flex;gap:10px;margin-bottom:18px}.tab{padding:13px 24px;border:1px solid #d9e1eb;border-radius:24px;background:#fff;font-weight:800;color:#738093;cursor:pointer}.tab.active{background:#24364d;color:#fff;border-color:#24364d}.controls{display:flex;gap:8px;align-items:center;margin-bottom:15px;padding:10px 14px;width:max-content;background:#f4f7fa;border:1px solid #d8e0e9;border-radius:16px}.controls button,.controls select{height:36px;border:1px solid #ccd6e1;background:#fff;border-radius:8px;padding:0 12px;font-weight:700;color:#24364d}.schedule-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;overflow:hidden;border-radius:18px;table-layout:fixed}.schedule-table thead{background:#30415a;color:#fff}.schedule-table th,.schedule-table td{padding:15px 10px;text-align:center}.schedule-table td{border-bottom:1px solid #e9edf2;color:#253448}.schedule-table th:nth-child(1){width:13%}.schedule-table th:nth-child(2){width:12%}.schedule-table th:nth-child(3){width:32%}.match-line{font-weight:800}.match-score{font-weight:900;color:#163d6a;padding:0 12px}.team-icon{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin:0 5px}.table-button{border:1px solid #d3dce7;background:#fff;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}.calendar-view{display:none}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e1e6ed;border:1px solid #e1e6ed;border-radius:16px;overflow:hidden}.calendar-grid>div{background:#fff;min-height:104px;padding:10px}.calendar-grid .dow{min-height:auto;text-align:center;font-weight:800;padding:9px;background:#f4f7fa}.cal-game{margin-top:9px;font-size:13px;font-weight:800}.cal-time{margin-top:3px;font-size:12px;color:#6d7b8c;font-weight:800}.empty{padding:60px;text-align:center;color:#7a8797;font-weight:700}</style></head><body><main class="container page-wrap"><section class="page-content schedule-wrap"><div class="schedule-head"><h1>경기일정 · 결과</h1><div>홈 &gt; 일정 · 결과</div></div><div class="tabs"><button class="tab active" data-view="list">리스트</button><button class="tab" data-view="calendar">달력</button></div><div class="controls"><button id="prev-month">&lt;</button><select id="year"><option value="2026">2026</option></select><select id="month"><option value="08">08</option><option value="09">09</option></select><button id="next-month">&gt;</button></div><div id="list-view"><table class="schedule-table"><thead><tr><th>날짜</th><th>시간</th><th>경기</th><th>리뷰</th><th>하이라이트</th></tr></thead><tbody id="schedule-body"></tbody></table></div><div id="calendar-view" class="calendar-view"><div class="calendar-grid" id="calendar-grid"></div></div></section></main><script>const icons={키움:'https://cdn.discordapp.com/emojis/1536572678968967258.webp?size=44',양키스:'https://cdn.discordapp.com/emojis/1536577218011070494.webp?size=44'};const aug=[['08.14(금)','20:30','양키스','6','0','키움','경기종료'],['08.15(토)','15:00','키움','0','1','양키스','경기종료'],['08.16(일)','15:00','양키스','5','4','키움','경기종료'],['08.17(월)','20:00','키움','0','5','양키스','경기종료'],['08.18(화)','20:00','키움','6','4','양키스','경기종료'],['08.19(수)','20:00','키움','3','4','양키스','경기종료'],['08.21(금)','20:00','양키스','5','1','키움','경기종료'],['08.22(토)','16:00','키움','0','1','양키스','경기종료'],['08.23(일)','16:00','양키스','4','7','키움','경기종료'],['08.25(화)','20:00','키움','','','양키스','경기예정'],['08.26(수)','20:00','양키스','','','키움','경기예정'],['08.28(금)','20:00','키움','','','양키스','경기예정'],['08.29(토)','16:00','양키스','','','키움','경기예정'],['08.30(일)','16:00','키움','','','양키스','경기예정']];const septDates=['01','02','04','05','06','08','09','11','12','13','15','16','18','19','20','22','23','25','26','27','29','30'];const dow=['일','월','화','수','목','금','토'];const sept=septDates.map((d,i)=>{let dt=new Date(2026,8,+d),wd=dt.getDay(),time=(wd===6||wd===0)?'16:00':'20:00';let a=i%2?'키움':'양키스',b=i%2?'양키스':'키움';return ['09.'+d+'('+dow[wd]+')',time,a,'','',b,'경기예정']});let year=document.getElementById('year'),month=document.getElementById('month'),body=document.getElementById('schedule-body');function rows(){return month.value==='08'?aug:sept}function team(n){return '<img class="team-icon" src="'+icons[n]+'">'+n}function match(r){return '<div class="match-line">'+team(r[2])+' <span class="match-score">'+(r[3]?r[3]+' : '+r[4]:'vs')+'</span> '+team(r[5])+'</div>'}function renderCalendar(){let grid=document.getElementById('calendar-grid'),data=rows(),m=+month.value,max=m===9?30:31,offset=new Date(2026,m-1,1).getDay();grid.innerHTML=dow.map(x=>'<div class="dow">'+x+'</div>').join('');for(let i=0;i<offset;i++)grid.innerHTML+='<div></div>';for(let d=1;d<=max;d++){let p=String(m).padStart(2,'0')+'.'+String(d).padStart(2,'0'),r=data.find(x=>x[0].startsWith(p));grid.innerHTML+='<div><b>'+d+'</b>'+(r?'<div class="cal-game">'+r[2]+' '+(r[3]?r[3]+' : '+r[4]:'vs')+' '+r[5]+'<div class="cal-time">'+r[1]+'</div></div>':'')+'</div>'}}function render(){let data=rows();body.innerHTML=data.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+match(r)+'</td><td>'+(r[6]==='경기종료'?'<button class="table-button">리뷰</button>':'')+'</td><td>'+(r[6]==='경기종료'?'<button class="table-button">하이라이트</button>':'')+'</td></tr>').join('');renderCalendar()}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('list-view').style.display=t.dataset.view==='list'?'block':'none';document.getElementById('calendar-view').style.display=t.dataset.view==='calendar'?'block':'none'});prevMonth.onclick=nextMonth.onclick=()=>{month.value=month.value==='08'?'09':'08';render()};month.onchange=render;render();</script></body></html>
