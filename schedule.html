<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경기일정 · 결과 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.schedule-wrap{background:#fff;border:1px solid #e1e6ec;border-radius:18px;padding:26px}.schedule-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.schedule-head h1{margin:0;font-size:30px}.tabs{display:flex;gap:24px;border-bottom:1px solid #dfe5ec;margin-bottom:16px}.tab{padding:12px 8px;font-weight:800;cursor:pointer}.tab.active{border-bottom:3px solid #203a59}.controls{display:flex;align-items:center;gap:8px;margin-bottom:16px}.controls button,.controls select{height:34px;border:1px solid #d6dee8;background:#fff;border-radius:6px;padding:0 10px}.schedule-table{width:100%;border-collapse:collapse}.schedule-table th,.schedule-table td{padding:13px 10px;border-bottom:1px solid #edf0f4;text-align:center}.teams-col{font-weight:700}.result-score{font-weight:900;color:#203a59}.calendar-view{display:none}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#e2e7ed;border:1px solid #e2e7ed}.calendar-grid div{background:#fff;min-height:105px;padding:10px}.calendar-grid .dow{min-height:auto;text-align:center;font-weight:800;padding:8px}.cal-game{margin-top:8px;font-size:13px;font-weight:800}.cal-score{color:#203a59}@media(max-width:760px){.schedule-wrap{padding:14px;overflow:auto}.schedule-table{min-width:760px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li class="has-dropdown"><a href="schedule.html">일정 · 결과</a><ul class="dropdown"><li><a href="schedule.html">경기일정 · 결과</a></li><li><a href="gamecenter.html">게임센터</a></li><li><a href="scoreboard.html">스코어보드</a></li></ul></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a class="active" href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html">게임센터</a><a href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content schedule-wrap"><div class="schedule-head"><h1>경기일정 · 결과</h1><div>홈 &gt; 일정 · 결과 &gt; 경기일정 · 결과</div></div><div class="tabs"><div class="tab active" data-view="list">리스트</div><div class="tab" data-view="calendar">달력</div></div><div class="controls"><button id="prev-month">&lt;</button><select id="year"><option value="2026">2026</option><option value="2025">2025</option></select><select id="month"><option value="08">08</option><option value="09">09</option></select><button id="next-month">&gt;</button></div><div id="list-view"><table class="schedule-table"><thead><tr><th>날짜</th><th>시간</th><th>경기</th><th>게임센터</th><th>하이라이트</th><th>TV</th><th>비고</th></tr></thead><tbody id="schedule-body"></tbody></table></div><div id="calendar-view" class="calendar-view"><div class="calendar-grid" id="calendar-grid"></div></div></section></main><script>const games=[['08.14(금)','20:30','키움','6','0','양키스','경기종료'],['08.15(토)','15:00','양키스','0','1','키움','경기종료'],['08.16(일)','15:00','키움','5','4','양키스','경기종료'],['08.17(월)','20:00','양키스','0','5','키움','경기종료'],['08.18(화)','20:00','양키스','4','6','키움','경기종료'],['08.19(수)','20:00','키움','','','양키스','경기예정'],['08.21(금)','20:30','양키스','','','키움','경기예정'],['08.22(토)','15:00','키움','','','양키스','경기예정'],['08.23(일)','15:00','양키스','','','키움','경기예정']];const sept=['09.01(화)','09.02(수)','09.04(금)','09.05(토)','09.06(일)','09.08(화)','09.09(수)','09.11(금)','09.12(토)','09.13(일)','09.15(화)','09.16(수)','09.18(금)','09.19(토)','09.20(일)','09.22(화)','09.23(수)'].map((d,i)=>[d,d.includes('(금)')?'20:30':(d.includes('(토)')||d.includes('(일)'))?'15:00':'20:00',i%2?'양키스':'키움','','',i%2?'키움':'양키스','경기예정']);const body=document.getElementById('schedule-body'),year=document.getElementById('year'),month=document.getElementById('month');function rows(){if(year.value!=='2026')return[];return month.value==='08'?games:sept}function render(){body.innerHTML=rows().map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="teams-col"><strong>${r[2]}</strong> ${r[3]?`<span class="result-score">${r[3]} : ${r[4]}</span>`:'vs'} <strong>${r[5]}</strong></td><td><button onclick="location.href='gamecenter.html'">${r[6]==='경기종료'?'결과':'리뷰'}</button></td><td><button>하이라이트</button></td><td>KNL-T</td><td>${r[6]}</td></tr>`).join('')||'<tr><td colspan="7">등록된 일정이 없습니다.</td></tr>';renderCalendar()}function renderCalendar(){const g=document.getElementById('calendar-grid');const data=rows();g.innerHTML=['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('');if(month.value==='08'&&year.value==='2026'){for(let i=0;i<6;i++)g.innerHTML+='<div></div>';for(let d=1;d<=31;d++){const row=data.find(x=>x[0].startsWith('08.'+String(d).padStart(2,'0')));g.innerHTML+=`<div><b>${d}</b>${row?`<div class="cal-game">${row[2]}${row[3]?` <span class="cal-score">${row[3]} : ${row[4]}</span>`:' vs'} ${row[5]}</div>`:''}</div>`}}else{for(let i=0;i<2;i++)g.innerHTML+='<div></div>';for(let d=1;d<=30;d++){const row=data.find(x=>x[0].startsWith('09.'+String(d).padStart(2,'0')));g.innerHTML+=`<div><b>${d}</b>${row?`<div class="cal-game">${row[2]} vs ${row[5]}</div>`:''}</div>`}}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('list-view').style.display=t.dataset.view==='list'?'block':'none';document.getElementById('calendar-view').style.display=t.dataset.view==='calendar'?'block':'none'});document.getElementById('prev-month').onclick=()=>{month.value=month.value==='08'?'09':'08';render()};document.getElementById('next-month').onclick=()=>{month.value=month.value==='08'?'09':'08';render()};year.onchange=render;month.onchange=render;render();</script></body></html>
