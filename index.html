<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>KNL | Korean Network League</title>
<style>:root{--bg:#f3f1eb;--panel:#fff;--panel2:#f7f5ef;--line:#e6e2d8;--muted:#78838c;--text:#172b3a;--accent:#e45e35;--green:#21835f;--red:#c34d4d;--blue:#3e75a8;--radius:13px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}::selection{background:#f4c4b3;color:#172b3a}
.shell{min-height:100vh;display:grid;grid-template-columns:254px minmax(0,1fr)}
.sidebar{background:#142b3a;color:#f5f3ed;padding:27px 17px 20px;display:flex;flex-direction:column;gap:30px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:12}
.brand{padding:0 13px 22px;border-bottom:1px solid #ffffff1c}.brand-mark{font-size:9px;letter-spacing:2.2px;color:#f28b68;font-weight:850}.brand h1{font-size:38px;line-height:1;letter-spacing:4px;margin:13px 0 7px;font-weight:900}.brand p{color:#aebbc1;font-size:9px;letter-spacing:1.55px;margin:0}
.nav-label{font-size:9px;color:#8398a3;font-weight:850;letter-spacing:2px;padding:0 13px;margin:0 0 9px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b9c5ca;text-align:left;padding:11px 13px;border-radius:8px;display:flex;align-items:center;gap:12px;font-weight:620;transition:background .18s,color .18s}.nav button:hover{background:#ffffff0d;color:#fff}.nav button.active{background:#f1eee6;color:#172b3a;font-weight:800;box-shadow:none}.nav .ico{width:18px;text-align:center;color:#f28b68;font-size:15px}.nav button.active .ico{color:var(--accent)}
.side-bottom{margin-top:auto;border-top:1px solid #ffffff1c;padding:17px 12px 0;color:#a9b8bf;font-size:10px;letter-spacing:.5px;line-height:1.9}.main{min-width:0}
.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,3.4vw,48px);background:#f8f7f2ed;backdrop-filter:blur(14px);position:sticky;top:0;z-index:8}.crumb{color:#8a9297;font-size:11px;letter-spacing:.3px}.crumb b{color:var(--text);font-weight:800}.top-actions{display:flex;gap:8px;align-items:center}
.season-select,.btn{background:#fff;border:1px solid #dcd8ce;color:var(--text);border-radius:7px;padding:9px 13px;transition:transform .15s,border-color .15s,background .15s}.season-select{font-size:11px;font-weight:800;letter-spacing:.7px;padding:9px 30px 9px 11px}.btn:hover{border-color:#a9aaa3;transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}.btn.primary:hover{background:#c94e2a;border-color:#c94e2a}.btn.ghost{background:transparent}.btn.small{padding:6px 9px;font-size:11px}.btn.danger{color:var(--red)}
.content{max-width:1500px;margin:auto;padding:34px clamp(18px,3.4vw,48px) 65px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px;padding-bottom:19px;border-bottom:1px solid #dedbd2}.eyebrow{color:var(--accent);font-size:9px;font-weight:900;letter-spacing:2.1px}.page-head h2{font-size:30px;line-height:1.2;margin:7px 0 5px;letter-spacing:-1.1px;font-weight:850}.sub{color:#818a8e;margin:0;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}.card{background:var(--panel);border:1px solid #e7e4dc;border-radius:var(--radius);padding:19px;min-width:0;box-shadow:0 3px 14px #283b4507}.stat-label{color:#899197;font-size:9px;font-weight:850;letter-spacing:1.35px}.stat-value{font-size:34px;line-height:1.1;font-weight:850;letter-spacing:-1.5px;margin:11px 0 4px;color:#172b3a}.stat-note{color:#9aa1a2;font-size:10px}.stats .card{position:relative;overflow:hidden}.stats .card:after{content:"";position:absolute;right:-14px;bottom:-27px;width:78px;height:78px;border:1px solid #e45e3524;border-radius:50%}.stats .card:first-child{border-top:3px solid var(--accent)}.two{grid-template-columns:1.15fr .85fr}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.section-title h3{font-size:12px;margin:0;font-weight:850;letter-spacing:.7px}.section-title span{font-size:9px;color:#90999d}
.table-wrap{overflow:auto;max-width:100%;border-radius:8px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:11px}th{text-align:right;color:#8a9498;font-size:9px;letter-spacing:1px;font-weight:850;padding:12px 10px;border-bottom:1px solid #e8e5dd;background:#faf9f5}td{text-align:right;padding:13px 10px;border-bottom:1px solid #f0eee8;color:#53616a}th:first-child,td:first-child{text-align:left}tr:last-child td{border-bottom:0}tbody tr:hover{background:#faf9f5}.team-cell{display:flex;align-items:center;gap:9px;font-weight:800;color:#203746}.team-badge{width:27px;height:27px;border-radius:7px;background:#edf0ed;display:grid;place-items:center;font-size:9px;color:var(--accent);font-weight:900;border:1px solid #e4e8e2}.rank{color:#a0a7a7;width:20px;display:inline-block;font-variant-numeric:tabular-nums}.positive{color:var(--green);font-weight:750}.negative{color:var(--red);font-weight:750}
.empty{padding:35px 18px;text-align:center;color:#929b9e;border:1px dashed #d8d8d0;border-radius:9px;background:#fbfaf7;font-size:11px}.empty b{display:block;color:#314653;margin-bottom:5px;font-size:13px}
.game-list{display:grid;gap:8px}.game{border:1px solid #e9e6de;border-radius:9px;padding:13px;background:#fff}.game-top{display:flex;justify-content:space-between;gap:8px;color:#929a9c;font-size:9px;margin-bottom:11px}.game-body{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}.game-team{font-weight:800;font-size:11px;overflow-wrap:anywhere}.game-team:last-child{text-align:right}.score{font-size:17px;font-weight:900;letter-spacing:.4px;color:#172b3a;white-space:nowrap}.status{font-size:9px;color:var(--green);border:1px solid #d2e9df;padding:3px 7px;border-radius:4px;background:#f5fbf7;white-space:nowrap}.status.scheduled{color:var(--blue);border-color:#d7e4f0;background:#f5f9fd}
.news-item{padding:14px 0;border-bottom:1px solid #eeece5}.news-item:last-child{border:0}.news-item small{color:var(--accent);font-size:9px;letter-spacing:1.1px;font-weight:800}.news-item b{display:block;margin:4px 0;color:#263c49;font-size:13px}.news-item p{margin:0;color:#899295;font-size:11px;line-height:1.65}
.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.team-card{display:flex;gap:14px;align-items:center}.team-logo{width:49px;height:49px;flex:0 0 49px;display:grid;place-items:center;border-radius:10px;background:#172f3e;color:#f28b68;font-size:14px;font-weight:900;letter-spacing:.5px}.team-card h3{margin:0;font-size:14px;color:#213946}.team-card p{margin:3px 0 0;color:#8b9598;font-size:10px}.team-meta{margin-left:auto;text-align:right;color:#899397;font-size:9px;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.field{background:#fff;border:1px solid #dfddd5;border-radius:7px;padding:10px 11px;color:var(--text);min-width:0;font-size:12px}.field::placeholder{color:#a1a7a6}.field:focus{outline:2px solid #f2c3b3;outline-offset:1px;border-color:var(--accent)}.filters .field{min-width:150px}
.admin-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#172f3e;color:#fff;border:0;padding:17px 19px;border-radius:10px;margin-bottom:16px}.admin-banner p{margin:3px 0 0;color:#b6c2c6;font-size:11px}.admin-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.tool{border:1px solid #e5e2da;background:#fff;border-radius:10px;padding:16px;text-align:left;color:var(--text);transition:transform .16s,border-color .16s,box-shadow .16s}.tool:hover{border-color:#e9a18a;transform:translateY(-2px);box-shadow:0 7px 18px #253b450d}.tool strong{display:block;margin:7px 0 4px;font-size:13px}.tool span{font-size:10px;color:#8c9699}
.modal-backdrop{position:fixed;inset:0;background:#142b3acc;backdrop-filter:blur(3px);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fbfaf6;border:1px solid #e5e1d7;border-radius:13px;padding:23px;box-shadow:0 25px 80px #142b3a44}.modal h3{margin:0 0 17px;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-row{display:grid;gap:6px}.form-row.full{grid-column:1/-1}.form-row label{font-size:10px;color:#77848a;font-weight:750}.form-row input,.form-row select,.form-row textarea{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}
.toast{position:fixed;bottom:22px;right:22px;background:#172f3e;color:#fff;border:1px solid #345363;padding:12px 16px;border-radius:8px;z-index:30;display:none;box-shadow:0 8px 30px #172f3e25;font-size:12px}.toast.show{display:block}.mobile-menu{display:none}.muted{color:#8c9699}.pill{font-size:9px;padding:4px 8px;border-radius:4px;background:#f1eee6;color:#586873;font-weight:800;letter-spacing:.5px}.footer-note{font-size:10px;color:#899397;margin-top:18px;line-height:1.8}
@media(max-width:1050px){.shell{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding-left:13px;padding-right:13px}.content{padding-left:23px;padding-right:23px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:760px){.shell{display:block}.sidebar{position:fixed;left:-275px;top:0;bottom:0;width:260px;height:100dvh;transition:left .22s ease;box-shadow:none}.sidebar.open{left:0;box-shadow:16px 0 50px #142b3a30}.mobile-menu{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;font-size:17px}.topbar{height:60px;padding:0 15px}.content{padding:24px 15px 48px}.page-head{align-items:flex-start;flex-direction:column;gap:13px;margin-bottom:18px;padding-bottom:16px}.page-head h2{font-size:26px}.page-head .actions{width:100%}.page-head .actions .btn{flex:0 0 auto}.team-grid{grid-template-columns:1fr}.admin-tools{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:15px}}
@media(max-width:480px){.crumb{font-size:10px}.top-actions{gap:5px}.season-select{max-width:86px;padding:8px 4px;font-size:10px}#adminShortcut{font-size:10px;padding:8px}.stats{gap:8px}.stat-value{font-size:28px}.stat-label{font-size:8px;letter-spacing:.8px}.stat-note{font-size:9px}.card{padding:13px}.admin-tools{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-row.full{grid-column:auto}.modal{padding:18px}.game-body{gap:6px}.game-team{font-size:10px}.score{font-size:15px}.team-card{gap:10px}.team-meta{font-size:8px}.filters .field{min-width:0;flex:1 1 130px;width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark">OFFICIAL LEAGUE PLATFORM</div><h1>KNL</h1><p>KOREAN NETWORK LEAGUE</p></div>
 <div><div class="nav-label">LEAGUE</div><nav class="nav" id="nav">
 <button data-page="dashboard" class="active"><span class="ico">▦</span>대시보드</button>
 <button data-page="standings"><span class="ico">▤</span>순위표</button>
 <button data-page="schedule"><span class="ico">▦</span>일정 · 결과</button>
 <button data-page="teams"><span class="ico">⬡</span>구단</button>
 <button data-page="players"><span class="ico">♙</span>선수 기록</button>
 <button data-page="draft"><span class="ico">▣</span>드래프트</button>
 <button data-page="news"><span class="ico">▤</span>리그 뉴스</button>
 </nav></div>
 <div><div class="nav-label">MANAGEMENT</div><nav class="nav"><button data-page="admin"><span class="ico">⚙</span>운영 관리</button></nav></div>
 <div class="side-bottom">KOREAN NETWORK LEAGUE<br><span id="sideSeason">SEASON 1</span><br><br>Independent community league</div>
</aside>
<main class="main">
 <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><div class="crumb">KNL <span class="muted">/</span> <b id="crumb">대시보드</b></div></div><div class="top-actions"><select class="season-select" id="seasonSelect" aria-label="시즌 선택"></select><button class="btn ghost" id="adminShortcut">⚙ 관리</button></div></header>
 <div class="content" id="app"></div>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal"><h3 id="modalTitle">항목 추가</h3><form id="modalForm"><div class="form-grid" id="modalFields"></div><div class="modal-actions"><button type="button" class="btn ghost" id="modalCancel">취소</button><button class="btn primary" type="submit">저장</button></div></form></section></div>
<div class="toast" id="toast"></div>
<script>
const KEY='knl_league_manager_v1';
const starter={leagueName:'Korean Network League',season:'S1',seasons:['S1','S2','S3','S4','S5'],teams:[],players:[],games:[],news:[],draft:[],updatedAt:null};
let db=load(),page='dashboard',modalSave=null;
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?{...starter,...x}:structuredClone(starter)}catch{return structuredClone(starter)}}
function save(){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db));render();toast('변경 사항을 이 브라우저에 저장했어.')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function teamName(v){return db.teams.find(t=>t.id===v)?.name||'미정'}
function gamesFinal(){return db.games.filter(g=>g.status==='종료'&&g.homeScore!==''&&g.awayScore!=='')}
function standings(){return db.teams.map(t=>{let w=0,l=0,d=0,rs=0,ra=0;gamesFinal().forEach(g=>{if(g.homeId===t.id){rs+=+g.homeScore;ra+=+g.awayScore;if(+g.homeScore>+g.awayScore)w++;else if(+g.homeScore<+g.awayScore)l++;else d++}if(g.awayId===t.id){rs+=+g.awayScore;ra+=+g.homeScore;if(+g.awayScore>+g.homeScore)w++;else if(+g.awayScore<+g.homeScore)l++;else d++}});let gp=w+l+d;return {...t,w,l,d,gp,rs,ra,rd:rs-ra,pct:gp?(w+d*.5)/gp:0}}).sort((a,b)=>b.pct-a.pct||b.rd-a.rd||b.rs-a.rs)}
function pct(n){return n.toFixed(3).replace(/^0/,'')}
function dateText(s){if(!s)return '날짜 미정';const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'})}
function pageHead(k,title,desc,actions=''){return '<div class="page-head"><div><div class="eyebrow">'+k+'</div><h2>'+title+'</h2><p class="sub">'+desc+'</p></div><div class="actions">'+actions+'</div></div>'}
function btn(label,act,primary=false){return '<button class="btn '+(primary?'primary':'')+'" data-action="'+act+'">'+label+'</button>'}
function empty(title,desc){return '<div class="empty"><b>'+title+'</b>'+desc+'</div>'}
function render(){document.getElementById('seasonSelect').innerHTML=db.seasons.map(s=>'<option '+(s===db.season?'selected':'')+'>'+esc(s)+'</option>').join('');document.getElementById('sideSeason').textContent='SEASON '+db.season;const names={dashboard:'대시보드',standings:'순위표',schedule:'일정 · 결과',teams:'구단',players:'선수 기록',draft:'드래프트',news:'리그 뉴스',admin:'운영 관리'};document.getElementById('crumb').textContent=names[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('app').innerHTML=views[page]();document.getElementById('sidebar').classList.remove('open')}
const views={
dashboard(){const s=standings(),gf=gamesFinal(),next=db.games.filter(g=>g.status!=='종료').sort((a,b)=>(a.date||'').localeCompare(b.date||''));return pageHead('LEAGUE OVERVIEW','리그 대시보드','KNL의 주요 현황과 최근 소식을 한눈에 확인해.','<span class="pill">'+esc(db.season)+' SEASON</span>')+'<div class="grid stats"><div class="card"><div class="stat-label">REGISTERED TEAMS</div><div class="stat-value">'+db.teams.length+'</div><div class="stat-note">등록 구단</div></div><div class="card"><div class="stat-label">REGISTERED PLAYERS</div><div class="stat-value">'+db.players.length+'</div><div class="stat-note">등록 선수</div></div><div class="card"><div class="stat-label">GAMES PLAYED</div><div class="stat-value">'+gf.length+'</div><div class="stat-note">종료 처리된 경기</div></div><div class="card"><div class="stat-label">UPCOMING GAMES</div><div class="stat-value">'+next.length+'</div><div class="stat-note">예정 및 진행 중 경기</div></div></div><div class="grid two"><section class="card"><div class="section-title"><h3>LEAGUE STANDINGS</h3><button class="btn small" data-page="standings">전체 보기 →</button></div>'+standingsTable(s.slice(0,5))+'</section><section class="card"><div class="section-title"><h3>NEXT GAMES</h3><button class="btn small" data-page="schedule">일정 보기 →</button></div>'+gameList(next.slice(0,3))+'</section><section class="card"><div class="section-title"><h3>RECENT RESULTS</h3><span>FINAL</span></div>'+gameList(gf.slice(-3).reverse())+'</section><section class="card"><div class="section-title"><h3>LEAGUE NEWS</h3><button class="btn small" data-page="news">뉴스 전체 →</button></div>'+newsList(db.news.slice(0,3))+'</section></div><p class="footer-note">관리 팁: 경기 결과를 종료로 저장하면 순위표가 자동 계산돼. 데이터 백업은 운영 관리에서 JSON 파일로 내려받을 수 있어.</p>'},
standings(){return pageHead('LEAGUE TABLE','순위표','종료된 경기 결과를 바탕으로 승률과 득실을 자동 계산해.',btn('＋ 구단 추가','add-team',true))+'<section class="card"><div class="section-title"><h3>'+esc(db.season)+' REGULAR SEASON</h3><span>승률 → 득실차 → 득점 순 정렬</span></div>'+standingsTable(standings(),true)+'</section><p class="footer-note">무승부는 승률 계산에서 0.5승으로 반영해. 경기 결과가 수정되면 순위도 자동으로 다시 계산돼.</p>'},
schedule(){let games=[...db.games].sort((a,b)=>(a.date||'').localeCompare(b.date||''));return pageHead('GAME CENTER','일정 · 결과','경기 일정을 등록하고 스코어를 입력하면 순위표에 자동 반영돼.',btn('＋ 경기 등록','add-game',true))+'<div class="card"><div class="filters"><input class="field" id="gameSearch" placeholder="구단명 검색"><select class="field" id="gameFilter"><option value="all">전체 경기</option><option>예정</option><option>종료</option><option>진행 중</option></select></div><div id="gamesTable">'+gamesTable(games)+'</div></div>'},
teams(){return pageHead('FRANCHISES','구단','구단명과 감독 정보를 관리해.',btn('＋ 구단 등록','add-team',true))+(db.teams.length?'<div class="grid team-grid">'+db.teams.map(t=>'<article class="card team-card"><div class="team-logo">'+esc(t.abbr||t.name.slice(0,2))+'</div><div><h3>'+esc(t.name)+'</h3><p>MANAGER · '+esc(t.manager||'미정')+'</p><p>'+esc(t.description||'등록된 구단 정보')+'</p></div><div class="team-meta">'+db.players.filter(p=>p.teamId===t.id).length+' PLAYERS<br><button class="btn small" data-action="edit-team" data-id="'+t.id+'">수정</button> <button class="btn small danger" data-action="delete-team" data-id="'+t.id+'">삭제</button></div></article>').join('')+'</div>':empty('등록된 구단이 없어','운영 관리에서 첫 구단을 등록해줘.'))},
players(){return pageHead('PLAYER DATABASE','선수 기록','선수 명단과 개인 성적을 한곳에서 관리해.',btn('＋ 선수 등록','add-player',true))+'<div class="card"><div class="filters"><input class="field" id="playerSearch" placeholder="선수 이름 검색"><select class="field" id="playerTeam"><option value="all">전체 구단</option>'+db.teams.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')+'</select></div><div id="playersTable">'+playersTable(db.players)+'</div></div>'},
draft(){return pageHead('ROOKIE DRAFT','드래프트 센터','드래프트 후보와 지명 결과를 기록해. 실제 자동 지명 기능이 아닌 운영 기록 관리 도구야.',btn('＋ 후보 등록','add-draft',true))+'<div class="card"><div class="section-title"><h3>DRAFT POOL & PICK LOG</h3><span>'+db.draft.length+' RECORDS</span></div>'+draftTable()+'</div><p class="footer-note">드래프트 진행 순서와 지명은 운영진이 확정한 뒤 기록해줘. 선수 등록과 구단 배정은 선수 관리 메뉴에서 별도로 수정할 수 있어.</p>'},
news(){return pageHead('OFFICIAL NEWS','리그 뉴스','개막 소식, 공지, MVP 발표 등 KNL의 공식 소식을 관리해.',btn('＋ 뉴스 작성','add-news',true))+'<div class="card">'+(db.news.length?newsList(db.news,true):empty('등록된 뉴스가 없어','첫 번째 리그 소식을 작성해줘.'))+'</div>'},
admin(){return pageHead('LEAGUE OFFICE','운영 관리','짧은 시간에도 관리할 수 있도록 자주 쓰는 작업을 모았어.','<span class="pill">LOCAL ADMIN</span>')+'<div class="admin-banner"><div><b>간편 운영 모드</b><p>경기 결과 입력 → 순위 자동 계산 → 백업 파일 저장 순서로 관리하면 돼.</p></div><span class="pill">READY</span></div><div class="admin-tools"><button class="tool" data-action="add-game"><span>GAME MANAGEMENT</span><strong>＋ 경기 등록 / 결과 입력</strong><span>일정, 스코어, 경기 상태 관리</span></button><button class="tool" data-action="add-player"><span>PLAYER MANAGEMENT</span><strong>＋ 선수 등록</strong><span>선수와 소속 구단 관리</span></button><button class="tool" data-action="add-team"><span>FRANCHISE MANAGEMENT</span><strong>＋ 구단 등록</strong><span>구단 및 감독 정보 관리</span></button><button class="tool" data-action="add-news"><span>NEWS MANAGEMENT</span><strong>＋ 공지 / 뉴스 작성</strong><span>리그 소식 게시</span></button><button class="tool" data-action="add-draft"><span>DRAFT MANAGEMENT</span><strong>＋ 드래프트 후보 / 지명</strong><span>드래프트 기록 정리</span></button><button class="tool" data-action="season"><span>SEASON SETTINGS</span><strong>시즌 관리</strong><span>시즌 추가 및 현재 시즌 변경</span></button><button class="tool" data-action="export"><span>DATA BACKUP</span><strong>↓ 데이터 백업</strong><span>모든 리그 데이터를 JSON으로 저장</span></button><button class="tool" data-action="import"><span>DATA RESTORE</span><strong>↑ 데이터 복원</strong><span>이전에 저장한 JSON 파일 불러오기</span></button><button class="tool" data-action="reset"><span>DATA MANAGEMENT</span><strong>초기화</strong><span>주의: 현재 브라우저 데이터 삭제</span></button></div><div class="card" style="margin-top:15px"><div class="section-title"><h3>운영 현황</h3><span>THIS BROWSER</span></div><div class="grid stats"><div><div class="stat-label">TEAMS</div><div class="stat-value">'+db.teams.length+'</div></div><div><div class="stat-label">PLAYERS</div><div class="stat-value">'+db.players.length+'</div></div><div><div class="stat-label">GAMES</div><div class="stat-value">'+db.games.length+'</div></div><div><div class="stat-label">NEWS</div><div class="stat-value">'+db.news.length+'</div></div></div><p class="footer-note">중요: 현재 버전은 서버나 데이터베이스 없이 브라우저 저장공간(localStorage)을 사용해. 이 브라우저에서만 수정 내용이 보이며 다른 참가자에게 자동 공유되지 않아. 여러 운영진이 함께 관리하거나 모든 방문자에게 실시간 공개하려면 이후 Firebase/Supabase 같은 공유 데이터베이스 연결이 필요해. 브라우저 데이터 삭제 전에 반드시 백업해줘.</p></div>'}
};
function standingsTable(rows,manage=false){if(!rows.length)return empty('순위표 데이터가 없어','구단을 등록하고 경기 결과를 입력하면 자동으로 표시돼.');return '<div class="table-wrap"><table><thead><tr><th>#</th><th>TEAM</th><th>G</th><th>W</th><th>L</th><th>T</th><th>PCT</th><th>GB</th><th>RS</th><th>RA</th><th>RD</th></tr></thead><tbody>'+rows.map((t,i)=>{let leader=rows[0],gb=((leader.w-t.w)+(t.l-leader.l))/2;return '<tr><td><span class="rank">'+(i+1)+'</span></td><td><div class="team-cell"><span class="team-badge">'+esc(t.abbr||t.name.slice(0,2))+'</span>'+esc(t.name)+'</div></td><td>'+t.gp+'</td><td>'+t.w+'</td><td>'+t.l+'</td><td>'+t.d+'</td><td>'+pct(t.pct)+'</td><td>'+(i===0?'-':gb.toFixed(1))+'</td><td>'+t.rs+'</td><td>'+t.ra+'</td><td class="'+(t.rd>=0?'positive':'negative')+'">'+(t.rd>0?'+':'')+t.rd+'</td></tr>'}).join('')+'</tbody></table></div>'}
function gameList(list){if(!list.length)return empty('표시할 경기가 없어','경기 등록 메뉴에서 일정을 추가해줘.');return '<div class="game-list">'+list.map(g=>'<div class="game"><div class="game-top"><span>'+dateText(g.date)+' · '+esc(g.venue||'장소 미정')+'</span><span class="status '+(g.status==='종료'?'':'scheduled')+'">'+esc(g.status)+'</span></div><div class="game-body"><div class="game-team">'+esc(teamName(g.awayId))+'</div><div class="score">'+(g.status==='종료'?g.awayScore+' : '+g.homeScore:'VS')+'</div><div class="game-team">'+esc(teamName(g.homeId))+'</div></div></div>').join('')+'</div>'}
function gamesTable(list){if(!list.length)return empty('등록된 경기가 없어','경기 등록 버튼으로 일정을 추가해줘.');return '<div class="table-wrap"><table><thead><tr><th>DATE</th><th>AWAY</th><th>SCORE</th><th>HOME</th><th>STATUS</th><th>관리</th></tr></thead><tbody>'+list.map(g=>'<tr><td>'+dateText(g.date)+'</td><td>'+esc(teamName(g.awayId))+'</td><td>'+(g.awayScore===''?'—':g.awayScore)+' : '+(g.homeScore===''?'—':g.homeScore)+'</td><td>'+esc(teamName(g.homeId))+'</td><td><span class="pill">'+esc(g.status)+'</span></td><td><button class="btn small" data-action="edit-game" data-id="'+g.id+'">수정</button> <button class="btn small danger" data-action="delete-game" data-id="'+g.id+'">삭제</button></td></tr>').join('')+'</tbody></table></div>'}
function playersTable(list){if(!list.length)return empty('등록된 선수가 없어','선수 등록 버튼으로 명단을 추가해줘.');return '<div class="table-wrap"><table><thead><tr><th>PLAYER</th><th>TEAM</th><th>POS</th><th>AVG</th><th>HR</th><th>RBI</th><th>ERA</th><th>관리</th></tr></thead><tbody>'+list.map(p=>'<tr><td style="text-align:left;font-weight:750">'+esc(p.name)+'</td><td>'+esc(teamName(p.teamId))+'</td><td>'+esc(p.position||'—')+'</td><td>'+esc(p.avg||'—')+'</td><td>'+esc(p.hr||'—')+'</td><td>'+esc(p.rbi||'—')+'</td><td>'+esc(p.era||'—')+'</td><td><button class="btn small" data-action="edit-player" data-id="'+p.id+'">수정</button> <button class="btn small danger" data-action="delete-player" data-id="'+p.id+'">삭제</button></td></tr>').join('')+'</tbody></table></div>'}
function newsList(list,manage=false){if(!list.length)return empty('등록된 소식이 없어','운영 관리에서 첫 공지를 작성해줘.');return list.map(n=>'<article class="news-item"><small>'+esc(n.category||'OFFICIAL')+' · '+dateText(n.date)+'</small><b>'+esc(n.title)+'</b><p>'+esc(n.body)+'</p>'+(manage?'<div style="margin-top:8px"><button class="btn small" data-action="edit-news" data-id="'+n.id+'">수정</button> <button class="btn small danger" data-action="delete-news" data-id="'+n.id+'">삭제</button></div>':'')+'</article>').join('')}
function draftTable(){if(!db.draft.length)return empty('드래프트 기록이 없어','후보 등록 버튼을 눌러 선수를 추가해줘.');return '<div class="table-wrap"><table><thead><tr><th>ROUND</th><th>PICK</th><th>PLAYER</th><th>TEAM</th><th>STATUS</th><th>관리</th></tr></thead><tbody>'+db.draft.map(d=>'<tr><td>'+esc(d.round)+'</td><td>'+esc(d.pick)+'</td><td>'+esc(d.name)+'</td><td>'+esc(d.team||'미지명')+'</td><td>'+esc(d.status)+'</td><td><button class="btn small" data-action="edit-draft" data-id="'+d.id+'">수정</button> <button class="btn small danger" data-action="delete-draft" data-id="'+d.id+'">삭제</button></td></tr>').join('')+'</tbody></table></div>'}
const fields={
team:[['name','구단명','text',true],['abbr','약칭','text'],['manager','감독','text'],['description','구단 소개','text']],
player:[['name','선수명','text',true],['teamId','소속 구단','team'],['position','포지션','text'],['avg','타율','text'],['hr','홈런','number'],['rbi','타점','number'],['era','평균자책점','text']],
game:[['date','경기 날짜','date',true],['awayId','원정팀','team',true],['homeId','홈팀','team',true],['awayScore','원정팀 점수','number'],['homeScore','홈팀 점수','number'],['status','경기 상태','status',true],['venue','구장 / 메모','text']],
news:[['title','제목','text',true],['category','분류','text'],['date','게시일','date'],['body','내용','textarea',true]],
draft:[['round','라운드','number',true],['pick','지명 순번','number',true],['name','선수명','text',true],['team','지명 구단','text'],['status','상태','draftstatus']]
};
function openModal(type,item){const map={team:'구단',player:'선수',game:'경기',news:'뉴스',draft:'드래프트'};document.getElementById('modalTitle').textContent=(item?'수정':'등록')+' · '+map[type];const box=document.getElementById('modalFields');box.innerHTML=fields[type].map(([key,label,kind,required])=>{let val=item?.[key]??(key==='date'?new Date().toISOString().slice(0,10):key==='status'?'예정':key==='category'?'OFFICIAL':key==='round'?1:key==='pick'?1:'');let input='';if(kind==='team')input='<select class="field" name="'+key+'"><option value="">미정</option>'+db.teams.map(t=>'<option value="'+t.id+'" '+(val===t.id?'selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select>';else if(kind==='status')input='<select class="field" name="'+key+'">'+['예정','진행 중','종료'].map(v=>'<option '+(val===v?'selected':'')+'>'+v+'</option>').join('')+'</select>';else if(kind==='draftstatus')input='<select class="field" name="'+key+'">'+['대기','지명 완료','참가 취소'].map(v=>'<option '+(val===v?'selected':'')+'>'+v+'</option>').join('')+'</select>';else if(kind==='textarea')input='<textarea class="field" name="'+key+'" rows="4">'+esc(val)+'</textarea>';else input='<input class="field" name="'+key+'" type="'+kind+'" value="'+esc(val)+'" '+(required?'required':'')+'>';return '<div class="form-row '+(kind==='textarea'?'full':'')+'"><label>'+label+(required?' *':'')+'</label>'+input+'</div>'}).join('');document.getElementById('modalBackdrop').classList.add('open');modalSave=values=>{if(type==='game'&&values.homeId===values.awayId)throw Error('홈팀과 원정팀은 달라야 해.');if(type==='game'&&values.status==='종료'&&(values.homeScore===''||values.awayScore===''))throw Error('종료 경기에는 양 팀 점수를 입력해줘.');if(type==='game'&&values.homeScore!==''&&+values.homeScore<0||type==='game'&&values.awayScore!==''&&+values.awayScore<0)throw Error('점수는 0 이상이어야 해.');const arr=db[type==='team'?'teams':type==='player'?'players':type==='game'?'games':type==='news'?'news':'draft'];if(item)Object.assign(item,values);else arr.push({id:id(),...values});document.getElementById('modalBackdrop').classList.remove('open');save()}}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');modalSave=null}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='KNL-backup-'+db.season+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('백업 파일을 다운로드했어.')}
function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.teams)||!Array.isArray(x.players)||!Array.isArray(x.games))throw Error();if(!confirm('현재 브라우저 데이터를 가져온 파일의 내용으로 교체할까?'))return;db={...starter,...x};save()}catch{alert('올바른 KNL 백업 파일이 아니야.')}};r.readAsText(f)};input.click()}
function action(a,idv){const type=a.split('-').pop(),map={team:'teams',player:'players',game:'games',news:'news',draft:'draft'};if(a.startsWith('add-')){if(type==='player'&&!db.teams.length)return toast('먼저 구단을 등록해줘.');if(type==='game'&&db.teams.length<2)return toast('경기를 등록하려면 구단이 2개 이상 필요해.');openModal(type);return}if(a.startsWith('edit-')){const t=type==='team'?'teams':type==='player'?'players':type==='game'?'games':type==='news'?'news':'draft';const item=db[t].find(x=>x.id===idv);if(item)openModal(type,item);return}if(a.startsWith('delete-')){const t=type==='team'?'teams':type==='player'?'players':type==='game'?'games':type==='news'?'news':'draft';if(!confirm('이 항목을 삭제할까?'))return;db[t]=db[t].filter(x=>x.id!==idv);if(type==='team'){db.players=db.players.filter(p=>p.teamId!==idv);db.games=db.games.filter(g=>g.homeId!==idv&&g.awayId!==idv)}save();return}if(a==='export')return exportData();if(a==='import')return importData();if(a==='season'){const name=prompt('추가하거나 전환할 시즌명을 입력해줘. 예: S6',db.season);if(!name)return;const s=name.trim().toUpperCase();if(!db.seasons.includes(s))db.seasons.push(s);db.season=s;save();return}if(a==='reset'){if(confirm('정말 초기화할까? 먼저 백업했는지 확인해줘.')&&confirm('되돌릴 수 없어. 다시 한 번 확인할까?')){localStorage.removeItem(KEY);db=structuredClone(starter);save()}return}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;render();return}const act=e.target.closest('[data-action]');if(act){action(act.dataset.action,act.dataset.id);return}});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});
document.getElementById('seasonSelect').addEventListener('change',e=>{db.season=e.target.value;save()});
document.getElementById('adminShortcut').onclick=()=>{page='admin';render()};
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.addEventListener('click',e=>{if(window.innerWidth<=760&&document.getElementById('sidebar').classList.contains('open')&&!e.target.closest('#sidebar')&&!e.target.closest('#menuBtn'))document.getElementById('sidebar').classList.remove('open')});
document.getElementById('modalCancel').onclick=closeModal;
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
document.getElementById('modalForm').onsubmit=e=>{e.preventDefault();if(!modalSave)return;const data=Object.fromEntries(new FormData(e.target).entries());try{modalSave(data)}catch(err){alert(err.message)}};
document.getElementById('app').addEventListener('input',e=>{const t=e.target;if(t.id==='gameSearch'){const q=t.value.toLowerCase();const f=document.getElementById('gameFilter')?.value||'all';const rows=db.games.filter(g=>(teamName(g.homeId)+' '+teamName(g.awayId)).toLowerCase().includes(q)&&(f==='all'||g.status===f)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));document.getElementById('gamesTable').innerHTML=gamesTable(rows)}else if(t.id==='playerSearch'){const q=t.value.toLowerCase();const f=document.getElementById('playerTeam')?.value||'all';const rows=db.players.filter(p=>p.name.toLowerCase().includes(q)&&(f==='all'||p.teamId===f));document.getElementById('playersTable').innerHTML=playersTable(rows)}});
document.getElementById('app').addEventListener('change',e=>{const t=e.target;if(t.id==='gameFilter'){const q=document.getElementById('gameSearch')?.value.toLowerCase()||'';const rows=db.games.filter(g=>(t.value==='all'||g.status===t.value)&&(teamName(g.homeId)+' '+teamName(g.awayId)).toLowerCase().includes(q)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));document.getElementById('gamesTable').innerHTML=gamesTable(rows)}else if(t.id==='playerTeam'){const q=document.getElementById('playerSearch')?.value.toLowerCase()||'';const rows=db.players.filter(p=>p.name.toLowerCase().includes(q)&&(t.value==='all'||p.teamId===t.value));document.getElementById('playersTable').innerHTML=playersTable(rows)}});
render();
</script>
</body></html>
