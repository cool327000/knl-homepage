<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KNL 리그 - 공식 홈페이지</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#">
        <span class="league-name">KNL 리그</span>
      </a>

      <nav class="main-nav" aria-label="주요 네비게이션">
        <ul>
          <li class="has-dropdown">
            <a href="schedule.html" aria-haspopup="true">일정 · 결과</a>
            <ul class="dropdown" role="menu">
              <li role="none"><a role="menuitem" href="schedule.html">경기일정 · 결과</a></li>
              <li role="none"><a role="menuitem" href="#game-center">게임센터</a></li>
              <li role="none"><a role="menuitem" href="#scoreboard">스코어보드</a></li>
              <li role="none"><a role="menuitem" href="#allstar">올스타전</a></li>
              <li role="none"><a role="menuitem" href="#intl">국제대회</a></li>
              <li role="none"><a role="menuitem" href="#weather">야구장 날씨</a></li>
            </ul>
          </li>
          <li><a href="#standings">순위</a></li>
          <li><a href="#news">뉴스</a></li>
          <li><a href="#teams">팀</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">

    <section id="standings" class="standings">
      <h2>순위</h2>
      <div class="table-wrap">
        <table id="standings-table" cellspacing="0">
          <thead>
            <tr>
              <th>순위</th>
              <th>팀</th>
              <th>승</th>
              <th>패</th>
              <th>무</th>
              <th>승률</th>
              <th>R</th>
              <th>RA</th>
              <th>RD</th>
              <th>STREAK</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS로 채움 -->
          </tbody>
        </table>
      </div>
    </section>

    <section id="schedule" class="schedule">
      <h2>오늘의 경기</h2>
      <ul id="today-schedule" class="schedule-list">
        <!-- JS로 채움 -->
      </ul>
    </section>

    <section id="news" class="news">
      <h2>뉴스</h2>
      <div id="news-carousel" class="carousel">
        <!-- JS로 채움 -->
      </div>
    </section>

    <section id="teams" class="teams">
      <h2>팀 소개</h2>
      <div class="teams-grid" id="teams-grid">
        <!-- 예시 팀 카드 JS로 채움 -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> KNL 리그. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
