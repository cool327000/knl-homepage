<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스코어보드 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.scoreboard-page{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 16px 40px rgba(30,48,80,.06)}.scoreboard-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px;border-radius:18px;background:linear-gradient(135deg,#20344f,#324e75);color:#fff;margin-bottom:24px}.scoreboard-hero h1{margin:0;font-size:32px;font-weight:950}.scoreboard-hero p{margin:7px 0 0;color:#c9d7ea}.scoreboard-date{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:#f8fafc;margin-bottom:24px}.date-button{width:42px;height:42px;border:1px solid #d6deea;background:#fff;border-radius:10px;font-size:26px;font-weight:800;line-height:1;cursor:pointer;color:#20344f}.date-button:hover{background:#eef3f9}.date-label{min-width:190px;text-align:center;font-size:20px;font-weight:900;color:var(--ink)}.score-list{min-height:350px;display:flex;align-items:center;justify-content:center}.score-empty{width:100%;padding:70px 20px;text-align:center;border:1px dashed #cfd8e5;border-radius:18px;color:var(--muted);font-weight:700}.score-empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:8px}@media(max-width:640px){.scoreboard-page{padding:14px}.scoreboard-hero{padding:20px;align-items:flex-start;flex-direction:column}.scoreboard-hero h1{font-size:27px}.date-label{min-width:150px;font-size:17px}.date-button{width:38px;height:38px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li class="has-dropdown"><a href="schedule.html">일정 · 결과</a><ul class="dropdown"><li><a href="schedule.html">경기일정 · 결과</a></li><li><a href="gamecenter.html">게임센터</a></li><li><a href="scoreboard.html">스코어보드</a></li></ul></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html">게임센터</a><a class="active" href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content scoreboard-page"><div class="scoreboard-hero"><div><h1>스코어보드</h1><p>날짜를 선택해 경기 스코어를 확인하세요.</p></div></div><div class="scoreboard-date"><button class="date-button" id="prev-date" aria-label="이전 날짜">‹</button><div class="date-label" id="date-label"></div><button class="date-button" id="next-date" aria-label="다음 날짜">›</button></div><div class="score-list" id="score-list"></div></section></main><script>const label=document.getElementById('date-label'),list=document.getElementById('score-list');const prev=document.getElementById('prev-date'),next=document.getElementById('next-date');let selected=new Date();selected=new Date(selected.getFullYear(),selected.getMonth(),selected.getDate());function formatDate(d){return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'('+['일','월','화','수','목','금','토'][d.getDay()]+')'}function render(){label.textContent=formatDate(selected);list.innerHTML='<div class="score-empty"><strong>등록된 스코어가 없습니다.</strong>날짜를 변경하면 해당 날짜의 스코어가 표시됩니다.</div>'}prev.onclick=()=>{selected.setDate(selected.getDate()-1);render()};next.onclick=()=>{selected.setDate(selected.getDate()+1);render()};render();</script></body></html>
