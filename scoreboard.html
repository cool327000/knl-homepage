<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스코어보드 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.scoreboard-page{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 16px 40px rgba(30,48,80,.06)}.scoreboard-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px;border-radius:18px;background:linear-gradient(135deg,#20344f,#324e75);color:#fff;margin-bottom:24px}.scoreboard-hero h1{margin:0;font-size:32px;font-weight:950}.scoreboard-hero p{margin:7px 0 0;color:#c9d7ea}.scoreboard-date{padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-size:13px;font-weight:800}.scoreboard-tabs{display:flex;gap:8px;margin-bottom:20px}.scoreboard-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 18px;font-weight:850;cursor:pointer}.scoreboard-tab.active{background:var(--ink);border-color:var(--ink);color:#fff}.score-list{display:grid;gap:14px}.score-card{border:1px solid var(--line);border-radius:18px;padding:20px;background:#fff;transition:.18s}.score-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(30,48,80,.08)}.score-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--muted);font-size:13px;font-weight:800}.score-status{padding:5px 10px;border-radius:999px;background:#e8f8f1;color:#21845f;font-size:12px}.score-status.live{background:#fff0f0;color:#d14b58}.score-main{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;text-align:center}.score-team{font-size:22px;font-weight:950}.score-number{font-size:42px;font-weight:950;line-height:1;color:var(--ink)}.score-divider{display:flex;align-items:center;justify-content:center;color:#a1acbb;font-weight:900}.inning-wrap{margin-top:20px;overflow:auto}.inning-table{width:100%;min-width:620px;border-collapse:separate;border-spacing:4px}.inning-table th{font-size:11px;color:#8390a2;font-weight:850;padding:5px}.inning-table td{background:#f4f6fa;text-align:center;padding:9px;border-radius:8px;font-weight:850}.inning-table td.team-label{background:#263b59;color:#fff;text-align:left;padding-left:14px;min-width:110px}.inning-table td.total{background:#e8efff;color:#315fae;font-weight:950}.score-empty{padding:55px;text-align:center;border:1px dashed #cfd8e5;border-radius:18px;color:var(--muted)}@media(max-width:640px){.scoreboard-page{padding:14px}.scoreboard-hero{padding:20px;align-items:flex-start;flex-direction:column}.scoreboard-hero h1{font-size:27px}.score-main{grid-template-columns:1fr 55px 1fr}.score-team{font-size:17px}.score-number{font-size:34px}.score-card{padding:16px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li class="has-dropdown"><a href="schedule.html">일정 · 결과</a><ul class="dropdown"><li><a href="schedule.html">경기일정 · 결과</a></li><li><a href="gamecenter.html">게임센터</a></li><li><a href="scoreboard.html">스코어보드</a></li></ul></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html">게임센터</a><a class="active" href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content scoreboard-page"><div class="scoreboard-hero"><div><h1>스코어보드</h1><p>KNL 리그 경기 결과와 이닝별 스코어를 확인하세요.</p></div><div class="scoreboard-date" id="score-date">2026 SEASON</div></div><div class="scoreboard-tabs"><button class="scoreboard-tab active" data-filter="all">전체</button><button class="scoreboard-tab" data-filter="finished">경기종료</button><button class="scoreboard-tab" data-filter="live">진행중</button></div><div class="score-list" id="score-list"></div></section></main><script>const games=[{date:'08.17(월) 20:00',status:'경기종료',a:'양키스',b:'키움',sa:0,sb:5,ia:[0,0,0,0,0,0,0,0,0],ib:[1,0,2,0,1,0,1,0,0]},{date:'08.16(일) 15:00',status:'경기종료',a:'키움',b:'양키스',sa:5,sb:4,ia:[1,0,0,2,0,1,0,1,0],ib:[0,1,1,0,2,0,0,0,0]},{date:'08.15(토) 15:00',status:'경기종료',a:'양키스',b:'키움',sa:0,sb:1,ia:[0,0,0,0,0,0,0,0,0],ib:[0,0,0,1,0,0,0,0,0]},{date:'08.14(금) 20:30',status:'경기종료',a:'키움',b:'양키스',sa:6,sb:0,ia:[2,0,1,0,2,1,0,0,0],ib:[0,0,0,0,0,0,0,0,0]}];const list=document.getElementById('score-list');function card(g){const row=(name,arr,total)=>`<tr><td class="team-label">${name}</td>${arr.map(x=>`<td>${x}</td>`).join('')}<td class="total">${total}</td></tr>`;return `<article class="score-card"><div class="score-card-top"><span>${g.date}</span><span class="score-status">${g.status}</span></div><div class="score-main"><div><div class="score-team">${g.a}</div><div class="score-number">${g.sa}</div></div><div class="score-divider">:</div><div><div class="score-team">${g.b}</div><div class="score-number">${g.sb}</div></div></div><div class="inning-wrap"><table class="inning-table"><thead><tr><th>TEAM</th>${[1,2,3,4,5,6,7,8,9].map(x=>`<th>${x}</th>`).join('')}<th>R</th></tr></thead><tbody>${row(g.a,g.ia,g.sa)}${row(g.b,g.ib,g.sb)}</tbody></table></div></article>`}function render(filter='all'){const data=filter==='all'?games:games.filter(g=>filter==='finished'?g.status==='경기종료':g.status==='진행중');list.innerHTML=data.length?data.map(card).join(''):'<div class="score-empty">표시할 경기가 없습니다.</div>'}document.querySelectorAll('.scoreboard-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.scoreboard-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});render();</script></body></html>
