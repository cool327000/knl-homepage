<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스코어보드 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.scoreboard-page{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px}.scoreboard-hero{padding:24px;border-radius:18px;background:linear-gradient(135deg,#20344f,#324e75);color:#fff;margin-bottom:24px}.scoreboard-hero h1{margin:0;font-size:32px}.scoreboard-date{display:flex;justify-content:center;align-items:center;gap:18px;padding:12px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;margin-bottom:24px}.date-button{width:42px;height:42px;border:1px solid #d6deea;background:#fff;border-radius:10px;font-size:26px;font-weight:800;cursor:pointer}.date-label{min-width:190px;text-align:center;font-size:20px;font-weight:900}.score-list{min-height:350px;display:flex;justify-content:center;align-items:center}.score-card{width:100%;border:1px solid #dbe2eb;border-radius:16px;overflow:hidden}.score-head{padding:15px 20px;background:#f4f7fa;font-weight:900}.innings{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center}.innings th,.innings td{padding:11px 2px;border-bottom:1px solid #e7ebf0;font-weight:700;font-size:14px;white-space:nowrap}.innings th:first-child,.innings td:first-child{width:13%;text-align:left;padding-left:16px}.innings th:not(:first-child),.innings td:not(:first-child){width:calc(87% / 17)}.total{background:#f4f7fa;font-weight:900}.score-empty{width:100%;padding:70px 20px;text-align:center;border:1px dashed #cfd8e5;border-radius:18px;color:#718096;font-weight:700}@media(max-width:900px){.scoreboard-page{padding:18px}.innings th,.innings td{padding:9px 1px;font-size:11px}.innings th:first-child,.innings td:first-child{width:16%;padding-left:8px}.innings th:not(:first-child),.innings td:not(:first-child){width:calc(84% / 17)}.score-head{font-size:14px;padding:13px}.scoreboard-hero{padding:18px}.scoreboard-hero h1{font-size:27px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html">게임센터</a><a class="active" href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content scoreboard-page"><div class="scoreboard-hero"><h1>스코어보드</h1></div><div class="scoreboard-date"><button class="date-button" id="prev">‹</button><div class="date-label" id="date"></div><button class="date-button" id="next">›</button></div><div class="score-list" id="list"></div></section></main><script>const D=document.getElementById('date'),L=document.getElementById('list');let d=new Date(2026,7,18);const g=[['키움',[0,0,1,0,1,1,0,1,0,0,0,0,2],6,18,0,1],['양키스',[0,0,0,2,0,0,1,1,0,0,0,0,0],4,10,3,0]];const k=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');function render(){D.textContent=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+'('+['일','월','화','수','목','금','토'][d.getDay()]+')';if(k(d)!=='2026-08-18'){L.innerHTML='<div class="score-empty">등록된 스코어가 없습니다.</div>';return}let h='<div class="score-card"><div class="score-head">경기종료 · 키움 6 : 4 양키스</div><table class="innings"><thead><tr><th>팀</th>'+Array.from({length:13},(_,i)=>'<th>'+(i+1)+'</th>').join('')+'<th>R</th><th>H</th><th>E</th><th>B</th></tr></thead><tbody>';g.forEach(t=>h+='<tr><td>'+t[0]+'</td>'+t[1].map(v=>'<td>'+v+'</td>').join('')+'<td class="total">'+t[2]+'</td><td>'+t[3]+'</td><td>'+t[4]+'</td><td>'+t[5]+'</td></tr>');L.innerHTML=h+'</tbody></table></div>'}document.getElementById('prev').onclick=()=>{d.setDate(d.getDate()-1);render()};document.getElementById('next').onclick=()=>{d.setDate(d.getDate()+1);render()};render();</script></body></html>
