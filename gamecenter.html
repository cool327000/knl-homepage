<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임센터 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.game-center-page{width:100%;background:linear-gradient(145deg,#fff,#fafbfc);border:1px solid #e6e8ec;border-radius:18px;padding:30px 32px;box-sizing:border-box}.game-center-title{font-size:32px;font-weight:800;color:#182538;margin:0 0 24px;padding-left:18px;border-left:5px solid #0e3a6b}.gc-toolbar{display:grid;grid-template-columns:48px 1fr 48px auto;align-items:center;gap:10px;padding:14px 16px;background:#f7f8fa;border:1px solid #e7eaf0;border-radius:12px;margin-bottom:22px}.gc-date{text-align:center;font-size:20px;font-weight:800}.gc-arrow,.gc-calendar{border:1px solid #d8dee7;background:#fff;border-radius:8px;font-weight:700;cursor:pointer}.gc-arrow{width:36px;height:36px;font-size:28px}.gc-calendar{padding:9px 14px}.gc-games{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;min-height:235px}.gc-card{width:220px;min-height:220px;background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:20px 16px;text-align:center;cursor:pointer}.gc-card:hover{border-color:#0e3a6b}.gc-top{display:flex;justify-content:center;font-weight:800}.gc-channel{font-size:12px;color:#7b8795;font-weight:700;margin:12px 0 9px}.gc-status{display:inline-block;border-radius:20px;padding:5px 14px;background:#7f8995;color:#fff;font-size:12px;font-weight:800;margin-bottom:15px}.gc-status.scheduled{background:#1388b7}.gc-match{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;font-size:17px;font-weight:800}.gc-team.left{text-align:right}.gc-team.right{text-align:left}.gc-vs{font-size:13px;color:#8792a0}.gc-note{text-align:center;color:#8a94a2;font-size:12px;margin:20px}.gc-detail{display:none;margin-top:30px;padding-top:22px;border-top:1px solid #e8ebef}.gc-detail.show{display:block}.gc-tabs{display:flex;gap:8px;margin-bottom:14px}.gc-tab{padding:11px 22px;border:1px solid #dce2e9;background:#fff;border-radius:9px;font-weight:800;color:#697586;cursor:pointer}.gc-tab.active{background:#20344f;color:#fff;border-color:#20344f}.gc-panel{display:none;padding:24px;border:1px solid #e3e7ec;border-radius:12px;background:#f7f8fa;color:#647184;font-weight:700}.gc-panel.active{display:block}.highlight-empty,.review-empty{text-align:center;padding:28px 10px;color:#8a94a2;font-size:14px;font-weight:700}@media(max-width:700px){.game-center-page{padding:20px 16px}.gc-toolbar{grid-template-columns:48px 1fr 48px}.gc-calendar{grid-column:1/-1}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav" aria-label="주요 네비게이션"><ul><li class="has-dropdown"><a href="schedule.html" aria-haspopup="true">일정 · 결과</a><ul class="dropdown" role="menu"><li role="none"><a role="menuitem" href="schedule.html">경기일정 · 결과</a></li><li role="none"><a role="menuitem" href="gamecenter.html">게임센터</a></li><li role="none"><a role="menuitem" href="scoreboard.html">스코어보드</a></li></ul></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html" class="active">게임센터</a><a href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content game-center-page"><h1 class="game-center-title">게임센터</h1><div class="gc-toolbar"><button class="gc-arrow" id="prev-day">‹</button><div class="gc-date" id="gc-date"></div><button class="gc-arrow" id="next-day">›</button><button class="gc-calendar" onclick="location.href='schedule.html'">▣ 캘린더</button></div><section class="gc-games" id="gc-games"></section><p class="gc-note">경기 일정과 결과는 KNL 리그 공식 일정에 따라 표시됩니다.</p><section class="gc-detail" id="gc-detail"><div class="gc-tabs"><button class="gc-tab active" data-tab="keyplayer">키플레이어</button><button class="gc-tab" data-tab="review">리뷰</button><button class="gc-tab" data-tab="highlight">하이라이트</button></div><div class="gc-panel active" id="keyplayer">경기의 주요 선수 정보가 표시됩니다.</div><div class="gc-panel" id="review"><div class="review-empty">등록된 리뷰가 없습니다.</div></div><div class="gc-panel" id="highlight"><div class="highlight-empty">등록된 하이라이트가 없습니다.</div></div></section></section></main><script>const gcDate=document.getElementById('gc-date'),gcGames=document.getElementById('gc-games'),gcDetail=document.getElementById('gc-detail');const schedules=[['2026-08-14','20:30','키움','양키스','6','0','경기종료'],['2026-08-15','15:00','양키스','키움','0','1','경기종료'],['2026-08-16','15:00','키움','양키스','5','4','경기종료'],['2026-08-17','20:00','양키스','키움','0','5','경기종료'],['2026-08-18','20:00','양키스','키움','4','6','경기종료'],['2026-08-19','20:00','키움','양키스','','','경기예정'],['2026-08-21','20:30','양키스','키움','','','경기예정'],['2026-08-22','15:00','키움','양키스','','','경기예정'],['2026-08-23','15:00','양키스','키움','','','경기예정']];let selected=new Date();selected=new Date(selected.getFullYear(),selected.getMonth(),selected.getDate());if(selected<new Date(2026,7,14)||selected>new Date(2026,8,23))selected=new Date(2026,7,18);function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function showTab(name){document.querySelectorAll('.gc-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.gc-panel').forEach(x=>x.classList.toggle('active',x.id===name))}function render(){gcDetail.classList.remove('show');showTab('keyplayer');const rows=schedules.filter(x=>x[0]===key(selected));gcDate.textContent=key(selected).replaceAll('-','.')+'('+['일','월','화','수','목','금','토'][selected.getDay()]+')';gcGames.innerHTML=rows.map(r=>`<article class="gc-card"><div class="gc-top">☁ ${r[1]}</div><div class="gc-channel">SPOTV</div><div class="gc-status ${r[6]==='경기예정'?'scheduled':''}">${r[6]}</div><div class="gc-match"><span class="gc-team left">${r[2]}${r[4]?' '+r[4]:''}</span><span class="gc-vs">VS</span><span class="gc-team right">${r[5]?r[5]+' ':''}${r[3]}</span></div></article>`).join('')||'<p class="gc-note">이 날짜에는 예정된 경기가 없습니다.</p>';document.querySelectorAll('.gc-card').forEach(c=>c.onclick=()=>gcDetail.classList.add('show'))}document.querySelectorAll('.gc-tab').forEach(tab=>tab.onclick=()=>showTab(tab.dataset.tab));document.getElementById('prev-day').onclick=()=>{selected.setDate(selected.getDate()-1);render()};document.getElementById('next-day').onclick=()=>{selected.setDate(selected.getDate()+1);render()};render();</script></body></html>
