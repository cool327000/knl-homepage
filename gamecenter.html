<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임센터 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.game-center-page{width:100%;background:#fff;border:1px solid #e6e8ec;border-radius:18px;padding:30px;box-sizing:border-box}.game-center-title{font-size:32px;font-weight:800;color:#182538;margin:0 0 24px;padding-left:18px;border-left:5px solid #0e3a6b}.gc-toolbar{display:grid;grid-template-columns:48px 1fr 48px auto;gap:10px;align-items:center;padding:14px;background:#f7f8fa;border:1px solid #e7eaf0;border-radius:12px}.gc-date{text-align:center;font-size:20px;font-weight:800}.gc-arrow,.gc-calendar{border:1px solid #d8dee7;background:#fff;border-radius:8px;font-weight:700;cursor:pointer}.gc-arrow{width:36px;height:36px;font-size:28px}.gc-calendar{padding:9px 14px}.gc-games{display:flex;justify-content:center;align-items:flex-start;min-height:270px;padding:22px 22px 18px}.gc-card{box-sizing:border-box;width:220px;height:235px;min-height:235px;background:#fff;border:1px solid #d9e1ea;border-top:3px solid #5c84c7;border-radius:15px;padding:22px 16px;text-align:center;cursor:pointer;box-shadow:none}.gc-card>b{display:block;font-size:17px;margin:2px 0 12px}.gc-status{display:inline-block;border-radius:18px;padding:6px 15px;background:#7f8995;color:#fff;font-size:12px;font-weight:800;margin:14px 0}.gc-match{font-size:18px;font-weight:800;margin-top:4px}.gc-detail{display:none;margin-top:20px;padding-top:22px;border-top:1px solid #e0e4e9}.gc-detail.show{display:block}.gc-tabs,.player-type-tabs{display:flex;gap:8px;margin-bottom:14px}.gc-tab,.player-type-tab{padding:11px 22px;border:1px solid #dce2e9;background:#fff;border-radius:9px;font-weight:800;cursor:pointer}.gc-tab.active,.player-type-tab.active{background:#20344f;color:#fff}.gc-panel{display:none;padding:24px;border:1px solid #d6dee7;border-radius:14px;background:#f7f8fa}.gc-panel.active{display:block}.highlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;padding:0}.highlight-card{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;height:178px;min-height:178px;padding:18px;border:1px solid #d5dee8;border-radius:15px;background:#fff;text-decoration:none;color:#182538;text-align:center;box-shadow:0 3px 10px rgba(24,37,56,.04);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}.highlight-card:hover{border-color:#4f7fc8;box-shadow:0 10px 24px rgba(32,52,79,.16);transform:translateY(-2px)}.highlight-card:focus-visible{outline:none;border-color:#4f7fc8;box-shadow:0 0 0 3px rgba(79,127,200,.18),0 10px 24px rgba(32,52,79,.16)}.highlight-play{width:56px;height:56px;margin:0 0 14px;border-radius:50%;background:#20344f;color:#fff;display:grid;place-items:center;font-size:21px;transition:transform .18s ease,box-shadow .18s ease}.highlight-card:hover .highlight-play{transform:scale(1.06);box-shadow:0 5px 14px rgba(32,52,79,.18)}.highlight-title{font-size:17px;font-weight:900;margin-bottom:7px}.highlight-empty,.review-empty{text-align:center;padding:28px;color:#8a94a2;font-weight:700}.player-stat-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.player-stat{background:#fff;border:1px solid #dfe5ec;border-radius:10px;padding:14px 8px;text-align:center}.player-stat strong{display:block;font-size:18px;color:#20344f;margin-bottom:6px}@media(max-width:700px){.highlight-grid{grid-template-columns:1fr}.player-stat-grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:701px){.highlight-card{min-width:0}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li><a href="schedule.html">일정 · 결과</a></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html" class="active">게임센터</a><a href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content game-center-page"><h1 class="game-center-title">게임센터</h1><div class="gc-toolbar"><button type="button" class="gc-arrow" id="prev-day">‹</button><div class="gc-date" id="gc-date"></div><button type="button" class="gc-arrow" id="next-day">›</button><button type="button" class="gc-calendar" onclick="location.href='schedule.html'">▣ 캘린더</button></div><section class="gc-games" id="gc-games"></section><section class="gc-detail" id="gc-detail"><div class="gc-tabs"><button class="gc-tab active" data-tab="keyplayer">키플레이어</button><button class="gc-tab" data-tab="review">리뷰</button><button class="gc-tab" data-tab="highlight">하이라이트</button></div><div class="gc-panel active" id="keyplayer"><div class="player-type-tabs"><button class="player-type-tab active" data-type="pitcher">투수</button><button class="player-type-tab" data-type="batter">타자</button></div><div class="player-stat-grid" id="player-stats"></div></div><div class="gc-panel" id="review"><div class="review-empty">등록된 리뷰가 없습니다.</div></div><div class="gc-panel" id="highlight"><div id="highlight-content"></div></div></section></section></main><script>const games={'2026-08-17':['양키스','0','키움','5'],'2026-08-18':['양키스','4','키움','6'],'2026-08-19':['키움','3','양키스','4'],'2026-08-21':['키움','5','양키스','1']};const highlights={'2026-08-19':[['경기 하이라이트 1','https://medal.tv/games/roblox/clips/nlRGuzpcMW0lmnkww?invite=cr-MSxkb04sMzE1ODI3MTkx'],['경기 하이라이트 2','https://medal.tv/games/roblox/clips/nlRwrehCu0hk5n6nI?invite=cr-MSxYVEUsMzE1ODI3MTkx']],'2026-08-21':[['경기 하이라이트 1','https://medal.tv/games/imported-clips/clips/nmGKVnR1hv69ws31w/spok?invite=cr-MSxvcmMsNjI1NjIxOTY2LA']]};let selected=new URLSearchParams(location.search).get('date')||'2026-08-19',playerType='pitcher';const days=['일','월','화','수','목','금','토'];function d(k){let a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2])}function k(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function draw(){let date=d(selected),g=games[selected];document.querySelector('.gc-date').textContent=selected.replaceAll('-','.')+'('+days[date.getDay()]+')';document.getElementById('gc-detail').classList.remove('show');document.getElementById('gc-games').innerHTML=g?`<article class="gc-card" id="game-card"><b>☁ 20:00</b><div style="border-top:1px solid #e4e7eb;margin:0 0 14px"></div><div style="font-size:12px;font-weight:800;color:#7d8794;margin-bottom:2px">SPOTV</div><div class="gc-status">경기종료</div><div class="gc-match">${g[0]} ${g[1]} vs ${g[3]} ${g[2]}</div></article>`:'<p>이 날짜에는 예정된 경기가 없습니다.</p>';let c=document.getElementById('game-card');if(c)c.onclick=()=>document.getElementById('gc-detail').classList.add('show');let h=highlights[selected]||[];document.getElementById('highlight-content').innerHTML=h.length?'<div class="highlight-grid">'+h.map(x=>`<a class="highlight-card" href="${x[1]}" target="_blank" rel="noopener"><div class="highlight-play">▶</div><div class="highlight-title">${x[0]}</div><div>Medal에서 영상 보기 ↗</div></a>`).join('')+'</div>':'<div class="highlight-empty">등록된 하이라이트가 없습니다.</div>';let s=playerType==='pitcher'?[['ERA','1.84'],['승','7'],['패','1'],['세이브','3'],['이닝','39.1'],['탈삼진','52'],['WHIP','0.91']]:[['타율','.347'],['안타','43'],['홈런','3'],['타점','12'],['득점','18'],['도루','5'],['OPS','1.008']];document.getElementById('player-stats').innerHTML=s.map(x=>`<div class="player-stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}document.getElementById('prev-day').onclick=()=>{let x=d(selected);x.setDate(x.getDate()-1);selected=k(x);history.replaceState(null,'','?date='+selected);draw()};document.getElementById('next-day').onclick=()=>{let x=d(selected);x.setDate(x.getDate()+1);selected=k(x);history.replaceState(null,'','?date='+selected);draw()};document.querySelectorAll('.gc-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gc-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.gc-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.querySelectorAll('.player-type-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.player-type-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');playerType=b.dataset.type;draw();document.getElementById('gc-detail').classList.add('show')});draw();</script></body></html>
