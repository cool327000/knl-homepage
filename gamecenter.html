<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임센터 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.game-center-page{background:#fff;border:1px solid #e6e8ec;border-radius:18px;padding:30px}.game-center-title{font-size:32px;font-weight:800;color:#182538;margin:0 0 24px;padding-left:18px;border-left:5px solid #0e3a6b}.gc-toolbar{display:grid;grid-template-columns:52px 1fr 52px auto;gap:14px;align-items:center;padding:14px 18px;background:#f7f8fa;border:1px solid #e7eaf0;border-radius:14px}.gc-date{text-align:center;font-size:20px;font-weight:800}.gc-arrow,.gc-calendar,.gc-tab{border:1px solid #d8dee7;background:#fff;border-radius:9px;font-weight:800;cursor:pointer;color:#182538}.gc-arrow{width:40px;height:40px;font-size:28px}.gc-calendar{padding:10px 15px}.gc-games{display:flex;justify-content:center;min-height:270px;padding:22px}.gc-card{width:220px;height:235px;background:#fff;border:1px solid #d9e1ea;border-top:3px solid #5c84c7;border-radius:15px;padding:22px 16px;text-align:center;cursor:pointer}.gc-status{display:inline-block;border-radius:18px;padding:6px 15px;background:#7f8995;color:#fff;font-size:12px;font-weight:800;margin:14px}.gc-status.scheduled{background:#5c84c7}.gc-match{display:flex;align-items:center;justify-content:center;gap:10px}.gc-team-logo{width:42px;height:42px;object-fit:contain}.gc-score,.gc-vs{font-size:18px;font-weight:900}.gc-detail{display:none;margin-top:20px;padding-top:22px;border-top:1px solid #e0e4e9}.gc-detail.show{display:block}.gc-tabs{display:flex;gap:8px;margin-bottom:14px}.gc-tab{padding:11px 22px}.gc-tab.active{background:#20344f;color:#fff}.gc-panel{display:none;padding:24px;border:1px solid #d6dee7;border-radius:14px;background:#f7f8fa}.gc-panel.active{display:block}.highlight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.highlight-card{height:178px;display:flex;flex-direction:column;align-items:center; oPJdCUs0zB?invite=cr-MSx6eWYsMzE1ODI3MTkx']],'2026-08-19':[['경기 하이라이트 1','https://medal.tv/games/roblox/clips/nlRGuzpcMW0lmnkww?invite=cr-MSxkb04sMzE1ODI3MTkx'],['경기 하이라이트 2','https://medal.tv/games/roblox/clips/nlRwrehCu0hk5n6nI?invite=cr-MSxYVEUsMzE1ODI3NTA4NTE'],['경기 하이라이트 2','https://medal.tv/games/roblox/clips/nlRwrehCu0hk5n6nI?invite=cr-MSxYVEUsMzE1ODI3NTA4NTE']]};let selected=new URLSearchParams(location.search).get('date')||'2026-08-22';const days=['일','월','화','수','목','금','토'];function parse(s){let p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function render(){let g=games[selected],d=parse(selected);date.textContent=selected.replaceAll('-','.')+'('+days[d.getDay()]+')';detail.classList.remove('show');if(!g){gamesEl.innerHTML='<div class="empty">이 날짜에는 예정된 경기가 없습니다.</div>';return}let score=g[1]!==''?'<span class="gc-score">'+g[1]+'</span><span class="gc-vs">:</span><span class="gc-score">'+g[3]+'</span>':'<span class="gc-vs">vs</span>';let status=g[5]===2?'경기 취소':(g[5]===1?'경기종료':'경기예정');gamesEl.innerHTML='<article class="gc-card" id="card"><b>☁ '+g[4]+'</b><hr><div>SPOTV</div><div class="gc-status '+(g[5]===0?'scheduled':'')+'">'+status+'</div><div class="gc-match"><img class="gc-team-logo" src="'+logos[g[0]]+'">'+score+'<img class="gc-team-logo" src="'+logos[g[2]]+'"></div></article>';card.onclick=()=>detail.classList.add('show');let h=highlights[selected]||[];highlightContent.innerHTML=h.length?'<div class="highlight-grid">'+h.map(x=>'<a class="highlight-card" href="'+x[1]+'" target="_blank"><div class="highlight-play">▶</div><div class="highlight-title">'+x[0]+'</div><div>Medal에서 영상 보기 ↗</div></a>').join('')+'</div>':'<div class="empty">등록된 하이라이트가 없습니다.</div>'}const date=document.getElementById('date'),detail=document.getElementById('detail'),gamesEl=document.getElementById('games'),highlightContent=document.getElementById('highlight-content');prev.onclick=()=>{let d=parse(selected);d.setDate(d.getDate()-1);selected=key(d);render()};next.onclick=()=>{let d=parse(selected);d.setDate(d.getDate()+1);selected=key(d);render()};document.querySelectorAll('.gc-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gc-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.gc-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});render();</script></body></html>
