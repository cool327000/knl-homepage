<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KNL 리그 - 게임센터</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .game-center-page{padding:28px 0 70px}.game-center-title{font-size:30px;margin:0 0 22px;font-weight:800}.gc-toolbar{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:18px}.gc-date{font-size:20px;font-weight:800;min-width:190px;text-align:center}.gc-arrow{border:0;background:none;font-size:38px;line-height:1;cursor:pointer;padding:0 4px}.gc-calendar{margin-left:auto;border:1px solid #aaa;background:#fff;padding:9px 15px;font-size:14px;cursor:pointer}.gc-games{display:grid;grid-template-columns:minmax(150px,207px);gap:10px}.gc-card{min-height:210px;border:1px solid #ddd;background:#fff;text-align:center;padding:14px 10px;box-sizing:border-box}.gc-top{display:flex;justify-content:center;align-items:center;gap:7px;font-size:14px;font-weight:700;margin-bottom:9px}.gc-weather{font-size:22px;font-weight:400}.gc-time{font-size:17px;font-weight:800}.gc-channel{font-size:13px;color:#777;font-weight:700;margin:12px 0 9px}.gc-status{display:inline-block;padding:4px 14px;border-radius:14px;background:#aaa;color:#fff;font-size:12px;font-weight:800;margin-bottom:12px}.gc-status.scheduled{background:#09a9df}.gc-match{display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:800;margin:3px 0 10px;white-space:nowrap}.gc-vs{font-weight:900}.gc-pitchers{display:flex;justify-content:center;gap:22px;color:#777;font-size:11px}.gc-pitchers span::first-letter{color:#00a7df}.gc-note{text-align:center;color:#888;font-size:12px;margin-top:14px}@media(max-width:520px){.gc-games{grid-template-columns:1fr}.game-center-title{font-size:25px}}
  </style>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav" aria-label="주요 네비게이션"><ul><li class="has-dropdown"><a href="schedule.html" aria-haspopup="true">일정 · 결과</a><ul class="dropdown" role="menu"><li role="none"><a role="menuitem" href="schedule.html">경기일정 · 결과</a></li><li role="none"><a role="menuitem" href="gamecenter.html">게임센터</a></li><li role="none"><a role="menuitem" href="index.html#scoreboard">스코어보드</a></li></ul></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header>
  <main class="container game-center-page"><h1 class="game-center-title">게임센터</h1><div class="gc-toolbar"><button class="gc-arrow" id="prev-day" aria-label="이전 날짜">‹</button><div class="gc-date" id="gc-date"></div><button class="gc-arrow" id="next-day" aria-label="다음 날짜">›</button><button class="gc-calendar" type="button" onclick="location.href='schedule.html'">▣ &nbsp;캘린더</button></div><section class="gc-games" id="gc-games"></section><p class="gc-note">경기 일정과 결과는 KNL 리그 공식 일정에 따라 표시됩니다.</p></main>
  <footer class="site-footer"><div class="container"><p>&copy; <span id="year"></span> KNL 리그. All rights reserved.</p></div></footer>
  <script>
    const gameData={
      '2026-08-16':{label:'2026.08.16(일)',games:[{venue:'잠실',weather:'☁',time:'19:00',channel:'SPOTV',status:'경기예정',a:'키움',b:'양키스',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-17':{label:'2026.08.17(월)',games:[]},
      '2026-08-18':{label:'2026.08.18(화)',games:[{venue:'잠실',weather:'☁',time:'20:00',channel:'SPOTV',status:'경기예정',a:'양키스',b:'키움',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-19':{label:'2026.08.19(수)',games:[{venue:'잠실',weather:'☁',time:'20:00',channel:'SPOTV',status:'경기예정',a:'키움',b:'양키스',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-20':{label:'2026.08.20(목)',games:[]},
      '2026-08-21':{label:'2026.08.21(금)',games:[{venue:'잠실',weather:'☁',time:'20:30',channel:'SPOTV',status:'경기예정',a:'양키스',b:'키움',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-22':{label:'2026.08.22(토)',games:[{venue:'잠실',weather:'☁',time:'15:00',channel:'SPOTV',status:'경기예정',a:'키움',b:'양키스',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-23':{label:'2026.08.23(일)',games:[{venue:'잠실',weather:'☁',time:'15:00',channel:'SPOTV',status:'경기예정',a:'양키스',b:'키움',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-25':{label:'2026.08.25(화)',games:[{venue:'잠실',weather:'☁',time:'20:00',channel:'SPOTV',status:'경기예정',a:'키움',b:'양키스',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-26':{label:'2026.08.26(수)',games:[{venue:'잠실',weather:'☁',time:'20:00',channel:'SPOTV',status:'경기예정',a:'양키스',b:'키움',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-28':{label:'2026.08.28(금)',games:[{venue:'잠실',weather:'☁',time:'20:30',channel:'SPOTV',status:'경기예정',a:'키움',b:'양키스',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-29':{label:'2026.08.29(토)',games:[{venue:'잠실',weather:'☁',time:'15:00',channel:'SPOTV',status:'경기예정',a:'양키스',b:'키움',pa:'선발 예정',pb:'선발 예정'}]},
      '2026-08-30':{label:'2026.08.30(일)',games:[{venue:'잠실',weather:'☁',time:'15:00',channel:'SPOTV',status:'경기예정',a:'키움',b:'양키스',pa:'선발 예정',pb:'선발 예정'}]}
    };
    const dates=Object.keys(gameData);let dateIndex=0;
    function renderGameCenter(){const d=gameData[dates[dateIndex]];document.getElementById('gc-date').textContent=d.label;document.getElementById('gc-games').innerHTML=d.games.map(g=>`<article class="gc-card"><div class="gc-top"><span>${g.venue}</span><span class="gc-weather">${g.weather}</span><span class="gc-time">${g.time}</span></div><div class="gc-channel">${g.channel}</div><span class="gc-status scheduled">${g.status}</span><div class="gc-match"><span>${g.a}</span><span class="gc-vs">VS</span><span>${g.b}</span></div><div class="gc-pitchers"><span>${g.pa}</span><span>${g.pb}</span></div></article>`).join('');}
    document.getElementById('prev-day').addEventListener('click',()=>{if(dateIndex>0){dateIndex--;renderGameCenter()}});document.getElementById('next-day').addEventListener('click',()=>{if(dateIndex<dates.length-1){dateIndex++;renderGameCenter()}});document.getElementById('year').textContent=new Date().getFullYear();renderGameCenter();
  </script>
</body>
</html>
