<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임센터 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.game-center-page{width:100%;background:linear-gradient(145deg,#fff,#fafbfc);border:1px solid #e6e8ec;border-radius:18px;padding:30px 32px;box-sizing:border-box}.game-center-title{font-size:32px;font-weight:800;color:#182538;margin:0 0 24px;padding-left:18px;border-left:5px solid #0e3a6b}.gc-toolbar{display:grid;grid-template-columns:48px 1fr 48px auto;align-items:center;gap:10px;padding:14px 16px;background:#f7f8fa;border:1px solid #e7eaf0;border-radius:12px;margin-bottom:22px}.gc-date{text-align:center;font-size:20px;font-weight:800}.gc-arrow,.gc-calendar{border:1px solid #d8dee7;background:#fff;border-radius:8px;font-weight:700;cursor:pointer}.gc-arrow{width:36px;height:36px;font-size:28px}.gc-calendar{padding:9px 14px}.gc-games{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;min-height:235px}.gc-card{width:220px;min-height:220px;background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:20px 16px;text-align:center;cursor:pointer}.gc-card:hover{border-color:#0e3a6b}.gc-top{display:flex;justify-content:center;font-weight:800}.gc-channel{font-size:12px;color:#7b8795;font-weight:700;margin:12px 0 9px}.gc-status{display:inline-block;border-radius:20px;padding:5px 14px;background:#7f8995;color:#fff;font-size:12px;font-weight:800;margin-bottom:15px}.gc-status.scheduled{background:#1388b7}.gc-match{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;font-size:17px;font-weight:800}.gc-team.left{text-align:right}.gc-team.right{text-align:left}.gc-vs{font-size:13px;color:#8792a0}.gc-note{text-align:center;color:#8a94a2;font-size:12px;margin:20px}.gc-detail{display:none;margin-top:30px;padding-top:22px;border-top:1px solid #e8ebef}.gc-detail.show{display:block}.gc-tabs{display:flex;gap:8px;margin-bottom:14px}.gc-tab{padding:11px 22px;border:1px solid #dce2e9;background:#fff;border-radius:9px;font-weight:800;color:#697586;cursor:pointer}.gc-tab.active{background:#20344f;color:#fff;border-color:#20344f}.gc-panel{display:none;padding:24px;border:1px solid #e3e7ec;border-radius:12px;background:#f7f8fa;color:#647184;font-weight:700}.gc-panel.active{display:block}.player-type-tabs{display:flex;gap:8px;margin-bottom:18px}.player-type-tab{padding:10px 22px;border:1px solid #dce2e9;background:#fff;border-radius:9px;font-weight:800;color:#697586;cursor:pointer}.player-type-tab.active{background:#314968;color:#fff;border-color:#314968}.player-stat-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.player-stat{background:#fff;border:1px solid #dfe5ec;border-radius:10px;padding:14px 8px;text-align:center}.player-stat strong{display:block;font-size:18px;color:#20344f;margin-bottom:6px}.player-stat span{font-size:12px;color:#718096}.highlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.highlight-card{display:block;padding:28px 18px;border:1px solid #d9e1ea;border-radius:14px;background:linear-gradient(135deg,#fff,#eef3f8);text-decoration:none;color:#182538;text-align:center}.highlight-play{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;background:#20344f;color:#fff;display:grid;place-items:center;font-size:22px}.highlight-title{font-size:17px;font-weight:900;margin-bottom:7px}.highlight-desc{font-size:12px;color:#778494;font-weight:700}.highlight-empty,.review-empty{text-align:center;padding:28px 10px;color:#8a94a2;font-size:14px;font-weight:700}@media(max-width:700px){.game-center-page{padding:20px 16px}.gc-toolbar{grid-template-columns:48px 1fr 48px}.gc-calendar{grid-column:1/-1}.highlight-grid{grid-template-columns:1fr}.player-stat-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li class="has-dropdown"><a href="schedule.html">일정 · 결과</a><ul class="dropdown"><li><a href="schedule.html">경기일정 · 결과</a></li><li><a href="gamecenter.html">게임센터</a></li><li><a href="scoreboard.html">스코어보드</a></li></ul></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html" class="active">게임센터</a><a href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content game-center-page"><h1 class="game-center-title">게임센터</h1><div class="gc-toolbar"><button class="gc-arrow" id="prev-day">‹</button><div class="gc-date" id="gc-date"></div><button class="gc-arrow" id="next-day">›</button><button class="gc-calendar" onclick="location.href='schedule.html'">▣ 캘린더</button></div><section class="gc-games" id="gc-games"></section><p class="gc-note">경기 일정과 결과는 KNL 리그 공식 일정에 따라 표시됩니다.</p><section class="gc-detail" id="gc-detail"><div class="gc-tabs"><button class="gc-tab active" data-tab="keyplayer">키플레이어</button><button class="gc-tab" data-tab="review">리뷰</button><button class="gc-tab" data-tab="highlight">하이라이트</button></div><div class="gc-panel active" id="keyplayer"><div class="player-type-tabs"><button class="player-type-tab active" data-player-type="pitcher">투수</button><button class="player-type-tab" data-player-type="batter">타자</button></div><div class="player-stat-grid" id="player-stats"></div></div><div class="gc-panel" id="review"><div class="review-empty">등록된 리뷰가 없습니다.</div></div><div class="gc-panel" id="highlight"><div id="highlight-content"></div></div></section></section></main><script>const gcDate=document.getElementById('gc-date'),gcGames=document.getElementById('gc-games'),gcDetail=document.getElementById('gc-detail'),highlightContent=document.getElementById('highlight-content'),playerStats=document.getElementById('player-stats');const schedules=[['2026-08-14','20:30','키움','양키스','6','0','경기종료'],['2026-08-15','15:00','양키스','키움','0','1','경기종료'],['2026-08-16','15:00','키움','양키스','5','4','경기종료'],['2026-08-17','20:00','양키스','키움','0','5','경기종료'],['2026-08-18','20:00','양키스','키움','4','6','경기종료'],['2026-08-19','20:00','키움','양키스','3','4','경기종료'],['2026-08-21','20:30','양키스','키움','','','경기예정'],['2026-08-22','15:00','키움','양키스','','','경기예정'],['2026-08-23','15:00','양키스','키움','','','경기예정']];const highlights18=[];const highlights19=[];const pitcherStats=[['ERA','1.84'],['승','7'],['패','1'],['세이브','3'],['이닝','39.1'],['탈삼진','52'],['WHIP','0.91']];const batterStats=[['타율','.347'],['안타','43'],['홈런','3'],['타점','12'],['득점','18'],['도루','5'],['OPS','1.008']];let playerType='pitcher';const params=new URLSearchParams(location.search);let selected=params.get('date')?new Date(params.get('date')+'T00:00:00'):new Date();selected=new Date(selected.getFullYear(),selected.getMonth(),selected.getDate());if(selected<new Date(2026,7,14)||selected>new Date(2026,8,23))selected=new Date(2026,7,19);function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function renderPlayerStats(){const data=playerType==='pitcher'?pitcherStats:batterStats;playerStats.innerHTML=data.map(s=>'<div class="player-stat"><strong>'+s[1]+'</strong><span>'+s[0]+'</span></div>').join('')}function showTab(name){document.querySelectorAll('.gc-tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.gc-panel').forEach(x=>x.classList.toggle('active',x.id===name))}function renderHighlight(){const day=key(selected),items=day==='2026-08-18'?highlights18:day==='2026-08-19'?highlights19:[];highlightContent.innerHTML=items.length?'<div class="highlight-grid">'+items.map(h=>'<a class="highlight-card" href="'+h[1]+'" target="_blank" rel="noopener"><div class="highlight-play">▶</div><div class="highlight-title">'+h[0]+'</div><div class="highlight-desc">영상 보기</div></a>').join('')+'</div>':'<div class="highlight-empty">등록된 하이라이트가 없습니다.</div>'}function render(){const rows=schedules.filter(x=>x[0]===key(selected));gcDate.textContent=key(selected).replaceAll('-','.')+'('+['일','월','화','수','목','금','토'][selected.getDay()]+')';gcGames.innerHTML=rows.map(r=>`<article class="gc-card"><div class="gc-top">☁ ${r[1]}</div><div class="gc-channel">SPOTV</div><div class="gc-status ${r[6]==='경기예정'?'scheduled':''}">${r[6]}</div><div class="gc-match"><span class="gc-team left">${r[2]}${r[4]?' '+r[4]:''}</span><span class="gc-vs">VS</span><span class="gc-team right">${r[5]?r[5]+' ':''}${r[3]}</span></div></article>`).join('')||'<p class="gc-note">이 날짜에는 예정된 경기가 없습니다.</p>';renderHighlight();renderPlayerStats();document.querySelectorAll('.gc-card').forEach(c=>c.onclick=()=>gcDetail.classList.add('show'));const requestedTab=params.get('tab');if(requestedTab&&['keyplayer','review','highlight'].includes(requestedTab)){gcDetail.classList.add('show');showTab(requestedTab)}else{gcDetail.classList.remove('show');showTab('keyplayer')}}document.querySelectorAll('.gc-tab').forEach(tab=>tab.onclick=()=>showTab(tab.dataset.tab));document.querySelectorAll('.player-type-tab').forEach(tab=>tab.onclick=()=>{playerType=tab.dataset.playerType;document.querySelectorAll('.player-type-tab').forEach(x=>x.classList.toggle('active',x===tab));renderPlayerStats()});document.getElementById('prev-day').onclick=()=>{selected.setDate(selected.getDate()-1);params.delete('tab');history.replaceState(null,'','gamecenter.html?date='+key(selected));render()};document.getElementById('next-day').onclick=()=>{selected.setDate(selected.getDate()+1);params.delete('tab');history.replaceState(null,'','gamecenter.html?date='+key(selected));render()};render();</script></body></html>
