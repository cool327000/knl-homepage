<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임센터 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>
.game-center-page{width:100%;background:linear-gradient(145deg,#fff,#fafbfc);border:1px solid #e6e8ec;border-radius:18px;padding:30px 32px;box-shadow:0 18px 45px rgba(22,35,52,.05)}.game-center-title{font-size:32px;font-weight:800;color:#182538;margin:0 0 24px;padding-left:18px;border-left:5px solid #0e3a6b}.gc-toolbar{display:grid;grid-template-columns:48px 1fr 48px auto;align-items:center;gap:10px;padding:14px 16px;background:#f7f8fa;border:1px solid #e7eaf0;border-radius:12px;margin-bottom:22px}.gc-date{text-align:center;font-size:20px;font-weight:800}.gc-arrow,.gc-calendar,.detail-button,.stat-tab{border:1px solid #d8dee7;background:#fff;border-radius:8px;font-weight:700;cursor:pointer}.gc-arrow{width:36px;height:36px;font-size:28px}.gc-calendar{padding:9px 14px}.gc-games{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;min-height:235px}.gc-card{width:220px;min-height:220px;background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:20px 16px;text-align:center;cursor:pointer;box-shadow:0 4px 16px rgba(23,40,60,.04)}.gc-card:hover{transform:translateY(-3px);border-color:#0e3a6b}.gc-top{display:flex;justify-content:center;gap:7px;font-weight:800}.gc-channel{font-size:12px;color:#7b8795;font-weight:700;margin:12px 0 9px}.gc-status{display:inline-block;border-radius:20px;padding:5px 14px;background:#7f8995;color:#fff;font-size:12px;font-weight:800;margin-bottom:15px}.gc-status.scheduled{background:#1388b7}.gc-match{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;font-size:17px;font-weight:800}.gc-team.left{text-align:right}.gc-team.right{text-align:left}.gc-vs{font-size:13px;color:#8792a0}.gc-note{text-align:center;color:#8a94a2;font-size:12px;margin:20px}.gc-detail,.gc-preview{display:none;margin-top:30px;padding-top:28px;border-top:1px solid #e8ebef}.gc-detail.show,.gc-preview.show{display:block}.detail-tabs{display:flex;background:#f0f3f6;padding:5px;border-radius:12px;gap:4px;margin-bottom:24px}.detail-tab{flex:1;text-align:center;padding:11px;border-radius:8px;font-weight:800;color:#7b8490;cursor:pointer}.detail-tab.active{background:#fff;color:#132844;box-shadow:0 3px 12px rgba(17,35,55,.1)}.detail-panel{display:none}.detail-panel.active{display:block}.detail-title{font-size:22px;font-weight:800;margin:0 0 14px}.detail-buttons,.stat-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px}.detail-button,.stat-tab{padding:8px 14px;white-space:nowrap}.detail-button.active,.stat-tab.active{background:#132844;color:#fff;border-color:#132844}.player-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.player-card{background:#fff;border:1px solid #e2e6eb;border-radius:14px;padding:18px;text-align:center}.player-rank{text-align:left;font-size:20px;font-weight:800;color:#667386}.player-rank.top{color:#c23}.player-avatar{width:88px;height:88px;border-radius:50%;background:#eef1f4;margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#718096}.player-name{font-size:18px;font-weight:800}.player-line{border-top:1px solid #e4e8ed;margin:15px 0}.player-value{font-weight:800}.player-sub{font-size:13px;color:#6d7886;margin-top:4px}.stat-summary{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:18px}.stat-box{background:#fff;border:1px solid #e2e6eb;border-radius:12px;padding:15px 8px;text-align:center}.stat-box b{display:block;font-size:18px;color:#132844;margin-bottom:6px}.stat-box span{font-size:12px;color:#687588;font-weight:700}.preview-placeholder,.review-placeholder,.highlight-placeholder{background:#f7f8fa;border:1px solid #e3e7ec;border-radius:12px;padding:50px;text-align:center;color:#7d8793;font-weight:700}@media(max-width:900px){.game-center-page{padding:24px 18px}.player-grid{grid-template-columns:repeat(2,1fr)}.stat-summary{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.game-center-page{padding:20px 12px}.gc-toolbar{grid-template-columns:42px 1fr 42px}.gc-calendar{grid-column:1/-1;justify-self:end}.player-grid{grid-template-columns:1fr}.stat-summary{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li class="has-dropdown"><a href="schedule.html">일정 · 결과</a><ul class="dropdown"><li><a href="schedule.html">경기일정 · 결과</a></li><li><a href="gamecenter.html">게임센터</a></li><li><a href="schedule.html#scoreboard">스코어보드</a></li></ul></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html" class="active">게임센터</a><a href="schedule.html#scoreboard">스코어보드</a></nav></aside><section class="page-content game-center-page"><h1 class="game-center-title">게임센터</h1><div class="gc-toolbar"><button class="gc-arrow" id="prev-day">‹</button><div class="gc-date" id="gc-date"></div><button class="gc-arrow" id="next-day">›</button><button class="gc-calendar" onclick="location.href='schedule.html'">▣ 캘린더</button></div><section class="gc-games" id="gc-games"></section><p class="gc-note">경기 일정과 결과는 KNL 리그 공식 일정에 따라 표시됩니다.</p><section class="gc-detail" id="gc-detail"><div class="detail-tabs"><div class="detail-tab active" data-panel="key">키플레이어</div><div class="detail-tab" data-panel="review">리뷰</div><div class="detail-tab" data-panel="highlight">하이라이트</div></div><div class="detail-panel active" id="detail-key"><h2 class="detail-title">키플레이어</h2><div class="detail-buttons"><button class="detail-button active" data-type="pitcher">투수</button><button class="detail-button" data-type="hitter">타자</button></div><div class="stat-tabs" id="stat-tabs"></div><div class="player-grid" id="player-grid"></div></div><div class="detail-panel" id="detail-review"><div class="review-placeholder">경기 리뷰가 준비되면 이곳에 표시됩니다.</div></div><div class="detail-panel" id="detail-highlight"><div class="highlight-placeholder">경기 하이라이트가 준비되면 이곳에 표시됩니다.</div></div></section><section class="gc-preview" id="gc-preview"><div class="preview-placeholder">경기 프리뷰가 이곳에 표시됩니다.</div></section></section></main><script>
const schedules=[['2026-08-14','20:30','키움','양키스','6','0','경기종료'],['2026-08-15','15:00','양키스','키움','0','1','경기종료'],['2026-08-16','15:00','키움','양키스','5','4','경기종료'],['2026-08-17','20:00','양키스','키움','0','5','경기종료'],['2026-08-18','20:00','양키스','키움','','','경기예정'],['2026-08-19','20:00','키움','양키스','','','경기예정'],['2026-08-21','20:30','양키스','키움','','','경기예정'],['2026-08-22','15:00','키움','양키스','','','경기예정'],['2026-08-23','15:00','양키스','키움','','','경기예정']];
let selected=new Date();selected=new Date(selected.getFullYear(),selected.getMonth(),selected.getDate());if(selected<new Date('2026-08-14'))selected=new Date('2026-08-14');if(selected>new Date('2026-09-23'))selected=new Date('2026-08-18');let mode='pitcher',activeStat='WPA';const pitcherStats=['WPA','탈삼진','볼펜 탈삼진','WHIP','이닝','평균자책점'];const hitterStats=['WPA','타율','홈런','타점','출루율','장타율','OPS'];
function key(d){return d.toISOString().slice(0,10)}function rowsForDate(){return schedules.filter(x=>x[0]===key(selected))}function closePanels(){gcDetail.classList.remove('show');gcPreview.classList.remove('show')}function render(){const rows=rowsForDate();gcDate.textContent=key(selected).replaceAll('-','.')+'('+['일','월','화','수','목','금','토'][selected.getDay()]+')';gcGames.innerHTML=rows.map((r,i)=>`<article class="gc-card"><div class="gc-top"><span class="gc-weather">☁</span><span>${r[1]}</span></div><div class="gc-channel">SPOTV</div><div class="gc-status ${r[6]==='경기예정'?'scheduled':''}">${r[6]}</div><div class="gc-match"><span class="gc-team left">${r[2]}${r[4]?' '+r[4]:''}</span><span class="gc-vs">VS</span><span class="gc-team right">${r[5]?r[5]+' ':''}${r[3]}</span></div></article>`).join('')||'<p class="gc-note">이 날짜에는 예정된 경기가 없습니다.</p>';document.querySelectorAll('.gc-card').forEach((c,i)=>c.onclick=()=>{closePanels();if(rows[i][6]==='경기종료'){gcDetail.classList.add('show');renderKeyPlayers()}else gcPreview.classList.add('show')})}
function renderTabs(){const stats=mode==='pitcher'?pitcherStats:hitterStats;statTabs.innerHTML=stats.map((s,i)=>`<button class="stat-tab ${s===activeStat?'active':''}" data-stat="${s}">${s}</button>`).join('');document.querySelectorAll('.stat-tab').forEach(b=>b.onclick=()=>{activeStat=b.dataset.stat;renderKeyPlayers()})}
function renderKeyPlayers(){renderTabs();if(mode==='pitcher'){const names=['키움 선발','양키스 선발','키움 투수','양키스 투수','키움 불펜'],vals=[34.1,1.4,1.1,.6,.3];playerGrid.innerHTML=names.map((n,i)=>`<div class="player-card"><div class="player-rank ${i===0?'top':''}">${i+1}위</div><div class="player-avatar">${i+1}</div><div class="player-name">${n}</div><div class="player-line"></div><div class="player-value">${vals[i]}%</div><div class="player-sub">${activeStat} 기준</div></div>`).join('')}else{const hitters=['키움 타자','양키스 타자','키움 중심타선','양키스 중심타선','키움 타자'];playerGrid.innerHTML=hitters.map((n,i)=>`<div class="player-card"><div class="player-rank ${i===0?'top':''}">${i+1}위</div><div class="player-avatar">${i+1}</div><div class="player-name">${n}</div><div class="player-line"></div><div class="player-value">${[34.1,18.7,12.4,8.9,6.1][i]}%</div><div class="player-sub">${activeStat} 기준</div></div>`).join('')+`<div class="stat-summary">${[['WPA','34.1%'],['타율','.347'],['홈런','3'],['타점','12'],['출루율','.421'],['장타율','.587'],['OPS','1.008']].map(x=>`<div class="stat-box"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>`}}
prevDay.onclick=()=>{selected.setDate(selected.getDate()-1);closePanels();render()};nextDay.onclick=()=>{selected.setDate(selected.getDate()+1);closePanels();render()};document.querySelectorAll('.detail-tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.detail-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.detail-panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('detail-'+t.dataset.panel).classList.add('active')});document.querySelectorAll('.detail-button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.detail-button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.type;activeStat=mode==='pitcher'?'WPA':'WPA';renderKeyPlayers()});const gcDate=document.getElementById('gc-date'),gcGames=document.getElementById('gc-games'),gcDetail=document.getElementById('gc-detail'),gcPreview=document.getElementById('gc-preview'),playerGrid=document.getElementById('player-grid'),statTabs=document.getElementById('stat-tabs'),prevDay=document.getElementById('prev-day'),nextDay=document.getElementById('next-day');render();
</script></body></html>
