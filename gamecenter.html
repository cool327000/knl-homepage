<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임센터 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.game-center-page{width:100%;background:#fff;border:1px solid #e6e8ec;border-radius:18px;padding:30px;box-sizing:border-box}.game-center-title{font-size:32px;font-weight:800;color:#182538;margin:0 0 24px;padding-left:18px;border-left:5px solid #0e3a6b}.gc-toolbar{width:100%;box-sizing:border-box;display:grid;grid-template-columns:52px minmax(0,1fr) 52px auto;gap:14px;align-items:center;padding:14px 18px;background:#f7f8fa;border:1px solid #e7eaf0;border-radius:14px}.gc-date{text-align:center;font-size:20px;font-weight:800;color:#182538;white-space:nowrap}.gc-arrow,.gc-calendar{border:1px solid #d8dee7;background:#fff;border-radius:9px;font-weight:800;cursor:pointer;color:#182538}.gc-arrow{width:40px;height:40px;font-size:28px;line-height:1;justify-self:center}.gc-calendar{padding:10px 15px;white-space:nowrap}.gc-games{display:flex;justify-content:center;align-items:flex-start;min-height:270px;padding:22px}.gc-card{width:220px;height:235px;background:#fff;border:1px solid #d9e1ea;border-top:3px solid #5c84c7;border-radius:15px;padding:22px 16px;text-align:center;cursor:pointer;box-sizing:border-box}.gc-card>b{display:block;font-size:17px;margin:2px 0 12px}.gc-status{display:inline-block;border-radius:18px;padding:6px 15px;background:#7f8995;color:#fff;font-size:12px;font-weight:800;margin:14px 0}.gc-status.scheduled{background:#5c84c7}.gc-match{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}.gc-team-logo{width:42px;height:42px;object-fit:contain}.gc-score,.gc-vs{font-size:18px;font-weight:900;color:#182538;white-space:nowrap}.gc-detail{display:none;margin-top:20px;padding-top:22px;border-top:1px solid #e0e4e9}.gc-detail.show{display:block}.gc-tabs,.player-type-tabs{display:flex;gap:8px;margin-bottom:14px}.gc-tab,.player-type-tab{padding:11px 22px;border:1px solid #dce2e9;background:#fff;border-radius:9px;font-weight:800;cursor:pointer}.gc-tab.active,.player-type-tab.active{background:#20344f;color:#fff}.gc-panel{display:none;padding:24px;border:1px solid #d6dee7;border-radius:14px;background:#f7f8fa}.gc-panel.active{display:block}.highlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.highlight-card{height:178px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #d5dee8;border-radius:15px;background:#fff;text-decoration:none;color:#182538;transition:.18s}.highlight-card:hover{border-color:#4f7fc8;box-shadow:0 10px 24px rgba(32,52,79,.16);transform:translateY(-2px)}.highlight-play{width:56px;height:56px;margin-bottom:14px;border-radius:50%;background:#20344f;color:#fff;display:grid;place-items:center;font-size:21px}.highlight-title{font-size:17px;font-weight:900;margin-bottom:7px}.highlight-empty,.review-empty{text-align:center;padding:28px;color:#8a94a2;font-weight:700}.player-stat-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.player-stat{background:#fff;border:1px solid #dfe5ec;border-radius:10px;padding:14px 8px;text-align:center}.player-stat strong{display:block;font-size:18px;color:#20344f;margin-bottom:6px}@media(max-width:700px){.highlight-grid{grid-template-columns:1fr}.player-stat-grid{grid-template-columns:repeat(2,1fr)}.gc-toolbar{grid-template-columns:48px minmax(0,1fr) 48px;padding:12px}.gc-calendar{display:none}}@media(max-width:420px){.game-center-page{padding:16px}.gc-date{font-size:17px}.gc-toolbar{gap:6px}}</style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li><a href="schedule.html">일정 · 결과</a></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html" class="active">게임센터</a><a href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content game-center-page"><h1 class="game-center-title">게임센터</h1><div class="gc-toolbar"><button class="gc-arrow" id="prev-day" type="button">‹</button><div class="gc-date" id="gc-date"></div><button class="gc-arrow" id="next-day" type="button">›</button><button class="gc-calendar" type="button" onclick="location.href='schedule.html'">▣ 캘린더</button></div><section class="gc-games" id="gc-games"></section><section class="gc-detail" id="gc-detail"><div class="gc-tabs"><button class="gc-tab active" data-tab="keyplayer">키플레이어</button><button class="gc-tab" data-tab="review">리뷰</button><button class="gc-tab" data-tab="highlight">하이라이트</button></div><div class="gc-panel active" id="keyplayer"><div class="player-type-tabs"><button class="player-type-tab active" data-type="pitcher">투수</button><button class="player-type-tab" data-type="batter">타자</button></div><div class="player-stat-grid" id="player-stats"></div></div><div class="gc-panel" id="review"><div class="review-empty">등록된 리뷰가 없습니다.</div></div><div class="gc-panel" id="highlight"><div id="highlight-content"></div></div></section></section></main><script>var logos={'키움':'https://cdn.discordapp.com/emojis/1536572678968967258.webp?size=44','양키스':'https://cdn.discordapp.com/emojis/1536577218011070494.webp?size=44'};var games={'2026-08-17':['양키스','0','키움','5','20:00',true],'2026-08-18':['양키스','4','키움','6','20:00',true],'2026-08-19':['키움','3','양키스','4','20:00',true],'2026-08-21':['키움','5','양키스','1','20:30',true],'2026-08-22':['키움','0','양키스','1','15:00',true],'2026-08-23':['양키스','','키움','','15:00',false],'2026-08-25':['키움','','양키스','','20:00',false],'2026-08-26':['양키스','','키움','','20:00',false],'2026-08-28':['키움','','양키스','','20:30',false],'2026-08-29':['양키스','','키움','','15:00',false],'2026-08-30':['키움','','양키스','','15:00',false]};var highlights={'2026-08-18':[['경기 하이라이트 1','https://medal.tv/games/roblox/clips/nlscef3g448vOoSyf?invite=cr-MSxscGEsNTQyMzMzOTQw'],['경기 하이라이트 2','https://medal.tv/games/roblox/clips/nlrswfUG0rxa61edO?invite=cr-MSxBakssNTQyMzMzOTQw'],['경기 하이라이트 3','https://medal.tv/games/roblox/clips/nlrc8DcoPJdCUs0zB?invite=cr-MSx6eWYsMzE1ODI3MTkx']],'2026-08-19':[['경기 하이라이트 1','https://medal.tv/games/roblox/clips/nlRGuzpcMW0lmnkww?invite=cr-MSxkb04sMzE1ODI3MTkx'],['경기 하이라이트 2','https://medal.tv/games/roblox/clips/nlRwrehCu0hk5n6nI?invite=cr-MSxYVEUsMzE1ODI3MTkx']],'2026-08-21':[['경기 하이라이트 1','https://medal.tv/games/imported-clips/clips/nmGKVnR1hv69ws31w/spok?invite=cr-MSxvcmMsNjI1NjIxOTY2LA']]};var selected=new URLSearchParams(location.search).get('date')||'2026-08-22',playerType='pitcher',days=['일','월','화','수','목','금','토'];function parseDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function render(){var g=games[selected],d=parseDate(selected),detail=document.getElementById('gc-detail'),area=document.getElementById('gc-games');document.getElementById('gc-date').textContent=selected.replace(/-/g,'.')+'('+days[d.getDay()]+')';detail.classList.remove('show');if(!g){area.innerHTML='<p style="padding:40px;color:#7d8794">이 날짜에는 예정된 경기가 없습니다.</p>';document.getElementById('highlight-content').innerHTML='<div class="highlight-empty">등록된 하이라이트가 없습니다.</div>';return}var score=g[5]?'<span class="gc-score">'+g[1]+'</span><span class="gc-vs">:</span><span class="gc-score">'+g[3]+'</span>':'<span class="gc-vs">vs</span>';area.innerHTML='<article class="gc-card" id="game-card"><b>☁ '+g[4]+'</b><div style="border-top:1px solid #e4e7eb;margin:0 0 14px"></div><div style="font-size:12px;font-weight:800;color:#7d8794">SPOTV</div><div class="gc-status '+(g[5]?'':'scheduled')+'">'+(g[5]?'경기종료':'경기예정')+'</div><div class="gc-match"><img class="gc-team-logo" src="'+logos[g[0]]+'">'+score+'<img class="gc-team-logo" src="'+logos[g[2]]+'"></div></article>';document.getElementById('game-card').onclick=function(){detail.classList.add('show')};var h=highlights[selected]||[];document.getElementById('highlight-content').innerHTML=h.length?'<div class="highlight-grid">'+h.map(function(x){return '<a class="highlight-card" href="'+x[1]+'" target="_blank" rel="noopener"><div class="highlight-play">▶</div><div class="highlight-title">'+x[0]+'</div><div>Medal에서 영상 보기 ↗</div></a>'}).join('')+'</div>':'<div class="highlight-empty">등록된 하이라이트가 없습니다.</div>';var stats=playerType==='pitcher'?[['ERA','1.84'],['승','7'],['패','1'],['세이브','3'],['이닝','39.1'],['탈삼진','52'],['WHIP','0.91']]:[['타율','.347'],['안타','43'],['홈런','3'],['타점','12'],['득점','18'],['도루','5'],['OPS','1.008']];document.getElementById('player-stats').innerHTML=stats.map(function(x){return '<div class="player-stat"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>'}).join('')}document.getElementById('prev-day').onclick=function(){var d=parseDate(selected);d.setDate(d.getDate()-1);selected=dateKey(d);history.replaceState(null,'','?date='+selected);render()};document.getElementById('next-day').onclick=function(){var d=parseDate(selected);d.setDate(d.getDate()+1);selected=dateKey(d);history.replaceState(null,'','?date='+selected);render()};document.querySelectorAll('.gc-tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.gc-tab').forEach(function(x){x.classList.remove('active')});document.querySelectorAll('.gc-panel').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')}});document.querySelectorAll('.player-type-tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.player-type-tab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');playerType=b.dataset.type;render();detail.classList.add('show')}});render();</script></body></html>
