<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임센터 - KNL 리그</title><link rel="stylesheet" href="styles.css"><style>.game-center-page{width:100%;background:#fff;border:1px solid #e6e8ec;border-radius:18px;padding:30px;box-sizing:border-box}.game-center-title{font-size:32px;font-weight:800;color:#182538;margin:0 0 24px;padding-left:18px;border-left:5px solid #0e3a6b}.gc-toolbar{display:grid;grid-template-columns:48px 1fr 48px auto;gap:10px;align-items:center;padding:14px;background:#f7f8fa;border:1px solid #e7eaf0;border-radius:12px}.gc-date{text-align:center;font-size:20px;font-weight:800}.gc-arrow,.gc-calendar{border:1px solid #d8dee7;background:#fff;border-radius:8px;font-weight:700;cursor:pointer}.gc-arrow{width:36px;height:36px;font-size:28px}.gc-calendar{padding:9px 14px}.gc-games{display:flex;justify-content:center;min-height:235px;padding:22px}.gc-card{width:220px;min-height:180px;background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:20px;text-align:center;cursor:pointer}.gc-status{display:inline-block;border-radius:20px;padding:5px 14px;background:#7f8995;color:#fff;font-size:12px;font-weight:800;margin:14px}.gc-match{font-size:18px;font-weight:800}.gc-detail{display:none;margin-top:20px;padding-top:22px;border-top:1px solid #e8ebef}.gc-detail.show{display:block}.gc-tabs{display:flex;gap:8px;margin-bottom:14px}.gc-tab{padding:11px 22px;border:1px solid #dce2e9;background:#fff;border-radius:9px;font-weight:800;cursor:pointer}.gc-tab.active{background:#20344f;color:#fff}.gc-panel{display:none;padding:24px;border:1px solid #e3e7ec;border-radius:12px;background:#f7f8fa}.gc-panel.active{display:block}.highlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.highlight-card{display:block;padding:28px 18px;border:1px solid #d9e1ea;border-radius:14px;background:#fff;text-decoration:none;color:#182538;text-align:center}.highlight-play{width:58px;height:58px;margin:auto auto 14px;border-radius:50%;background:#20344f;color:#fff;display:grid;place-items:center;font-size:22px}.highlight-title{font-size:17px;font-weight:900;margin-bottom:7px}.highlight-empty,.review-empty{text-align:center;padding:28px;color:#8a94a2;font-weight:700}.player-type-tabs{display:flex;gap:8px;margin-bottom:18px}.player-type-tab{padding:10px 22px;border:1px solid #dce2e9;background:#fff;border-radius:9px;font-weight:800;cursor:pointer}.player-type-tab.active{background:#314968;color:#fff}.player-stat-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.player-stat{background:#fff;border:1px solid #dfe5ec;border-radius:10px;padding:14px 8px;text-align:center}.player-stat strong{display:block;font-size:18px;color:#20344f;margin-bottom:6px}@media(max-width:700px){.highlight-grid{grid-template-columns:1fr}.player-stat-grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li><a href="schedule.html">일정 · 결과</a></li><li><a href="index.html#standings">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header><main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">일정 · 결과</div><nav class="side-menu"><a href="schedule.html">경기일정 · 결과</a><a href="gamecenter.html" class="active">게임센터</a><a href="scoreboard.html">스코어보드</a></nav></aside><section class="page-content game-center-page"><h1 class="game-center-title">게임센터</h1><div class="gc-toolbar"><button class="gc-arrow" id="prev-day">‹</button><div class="gc-date" id="gc-date"></div><button class="gc-arrow" id="next-day">›</button><button class="gc-calendar" onclick="location.href='schedule.html'">▣ 캘린더</button></div><section class="gc-games" id="gc-games"></section><section class="gc-detail" id="gc-detail"><div class="gc-tabs"><button class="gc-tab active" data-tab="keyplayer">키플레이어</button><button class="gc-tab" data-tab="review">리뷰</button><button class="gc-tab" data-tab="highlight">하이라이트</button></div><div class="gc-panel active" id="keyplayer"><div class="player-type-tabs"><button class="player-type-tab active" data-type="pitcher">투수</button><button class="player-type-tab" data-type="batter">타자</button></div><div class="player-stat-grid" id="player-stats"></div></div><div class="gc-panel" id="review"><div class="review-empty">등록된 리뷰가 없습니다.</div></div><div class="gc-panel" id="highlight"><div id="highlight-content"></div></div></section></section></main><script>const games={'2026-08-18':['양키스','4','키움','6'],'2026-08-19':['키움','3','양키스','4'],'2026-08-21':['키움','5','양키스','1']};const highlights={'2026-08-19':[['경기 하이라이트 1','https://medal.tv/games/roblox/clips/nlRGuzpcMW0lmnkww?invite=cr-MSxkb04sMzE1ODI3MTkx'],['경기 하이라이트 2','https://medal.tv/games/roblox/clips/nlRwrehCu0hk5n6nI?invite=cr-MSxYVEUsMzE1ODI3MTkx']],'2026-08-21':[['경기 하이라이트 1','https://medal.tv/games/imported-clips/clips/nmGKVnR1hv69ws31w/spok?invite=cr-MSxvcmMsNjI1NjIxOTY2LA']]};let selected=new URLSearchParams(location.search).get('date')||'2026-08-19';let type='pitcher';const day=['일','월','화','수','목','금','토'];function render(){let d=new Date(selected+'T00:00:00'),g=games[selected];document.getElementById('gc-date').textContent=selected.replaceAll('-','.')+'('+day[d.getDay()]+')';document.getElementById('gc-games').innerHTML=g?'<article class="gc-card" id="game-card"><b>20:00</b><div class="gc-status">경기종료</div><div class="gc-match">'+g[0]+' '+g[1]+' : '+g[3]+' '+g[2]+'</div></article>':'<p>이 날짜에는 예정된 경기가 없습니다.</p>';if(g)document.getElementById('game-card').onclick=()=>document.getElementById('gc-detail').classList.add('show');let hs=highlights[selected]||[];document.getElementById('highlight-content').innerHTML=hs.length?'<div class="highlight-grid">'+hs.map(x=>'<a class="highlight-card" href="'+x[1]+'" target="_blank" rel="noopener"><div class="highlight-play">▶</div><div class="highlight-title">'+x[0]+'</div><div>Medal에서 영상 보기 ↗</div></a>').join('')+'</div>':'<div class="highlight-empty">등록된 하이라이트가 없습니다.</div>';let s=type==='pitcher'?[['ERA','1.84'],['승','7'],['패','1'],['세이브','3'],['이닝','39.1'],['탈삼진','52'],['WHIP','0.91']]:[['타율','.347'],['안타','43'],['홈런','3'],['타점','12'],['득점','18'],['도루','5'],['OPS','1.008']];document.getElementById('player-stats').innerHTML=s.map(x=>'<div class="player-stat"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></div>').join('')}document.querySelectorAll('.gc-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gc-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.gc-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});document.querySelectorAll('.player-type-tab').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.player-type-tab').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('prev-day').onclick=()=>move(-1);document.getElementById('next-day').onclick=()=>move(1);function move(n){let d=new Date(selected+'T00:00:00');d.setDate(d.getDate()+n);selected=d.toISOString().slice(0,10);history.replaceState(null,'','?date='+selected);render()}render();</script></body></html>
