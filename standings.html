<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>순위 - KNL 리그</title>
<link rel="stylesheet" href="styles.css">
<style>
.standings-page{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 14px 35px rgba(30,48,80,.05)}
.standings-title{display:flex;justify-content:space-between;align-items:center;padding:4px 0 20px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.standings-title h1{margin:0;font-size:32px;font-weight:950;letter-spacing:-1.7px}.standings-title-right{display:flex;align-items:center;gap:12px}.standings-title-right span{font-size:13px;color:var(--muted)}
.calendar-link{position:relative;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border:1px solid #d7e0ea;border-radius:9px;background:#fff;color:#23354b;text-decoration:none;font-size:13px;font-weight:900;cursor:pointer}.calendar-link:hover{border-color:#9db4d0;background:#f7f9fc}
.calendar-pop{position:absolute;right:0;top:calc(100% + 8px);width:250px;padding:14px;background:#fff;border:1px solid #d7e0ea;border-radius:14px;box-shadow:0 14px 32px rgba(30,48,80,.16);z-index:20;display:none}.calendar-pop.open{display:block}.calendar-pop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calendar-pop-title{font-size:14px;font-weight:950;color:#24364d}.calendar-nav{width:28px;height:28px;border:1px solid #d7e0ea;background:#fff;border-radius:7px;font-weight:900;cursor:pointer}.calendar-week,.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.calendar-week span{text-align:center;font-size:10px;color:#7a8797;font-weight:900;padding:4px 0}.calendar-days button{height:28px;border:0;background:#fff;border-radius:7px;font-size:11px;font-weight:800;color:#26384d;cursor:pointer}.calendar-days button:hover{background:#eef4fb}.calendar-days button.today{font-weight:950;border:1px solid #9db4d0}.calendar-days button.selected{background:#24364d;color:#fff}.calendar-days button.empty{cursor:default}
.date-bar{height:70px;border:1px solid #d8e0e9;border-radius:16px;background:#f7f9fc;display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:18px}.date-arrow{width:42px;height:42px;border:1px solid #d3dce7;background:#fff;border-radius:10px;font-size:24px;font-weight:900;color:#193654;cursor:pointer}.date-arrow:hover{background:#eef4fb}.date-label{text-align:center;min-width:190px;font-size:20px;font-weight:950;color:#1e3148}
.season-row{margin-bottom:18px}.season-select{min-width:78px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;color:#23354b;font-weight:900;cursor:pointer;outline:none}
.standings-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(30,48,80,.045)}.standings-table{width:100%;border-collapse:collapse;table-layout:fixed}.standings-table th{height:50px;background:#26354b;color:#dbe5f4;font-size:13px;font-weight:900}.standings-table td{height:62px;text-align:center;border-bottom:1px solid #edf0f4;font-size:14px;font-weight:700}.standings-table tbody tr:hover{background:#f6f9ff}
.standings-table th:nth-child(1),.standings-table td:nth-child(1){width:8%}.standings-table th:nth-child(2),.standings-table td:nth-child(2){width:25%;text-align:left;padding-left:18px}.standings-table th:nth-child(3),.standings-table td:nth-child(3){width:9%}.standings-table th:nth-child(4),.standings-table td:nth-child(4){width:9%}.standings-table th:nth-child(5),.standings-table td:nth-child(5){width:9%}.standings-table th:nth-child(6),.standings-table td:nth-child(6){width:12%}.standings-table th:nth-child(7),.standings-table td:nth-child(7){width:9%}.standings-table th:nth-child(8),.standings-table td:nth-child(8){width:9%}.standings-table th:nth-child(9),.standings-table td:nth-child(9){width:10%}
.rank-number{font-size:18px;font-weight:950;color:#1e3554}.rank-team{font-weight:950;color:var(--ink)}.rank-team .team-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;margin-right:9px;background:#eef3fb;color:#304a6b;font-size:10px;font-weight:950;vertical-align:middle}.rank-team .team-mark.nc{background:#eef1f5}.rank-team .team-mark.kt{background:#edf1f7}.win-rate{font-weight:950;color:#214c80}.positive{color:#23805e;font-weight:900}.negative{color:#bd5c51;font-weight:900}.standings-note{display:flex;justify-content:space-between;gap:16px;margin-top:13px;color:var(--muted);font-size:12px}
@media(max-width:700px){.standings-page{padding:17px}.standings-title{align-items:flex-start;gap:8px}.standings-title h1{font-size:27px}.standings-title-right{flex-wrap:wrap;justify-content:flex-end}.date-bar{gap:12px}.date-label{min-width:165px;font-size:17px}.standings-card{overflow-x:auto}.standings-table{min-width:720px}.standings-note{display:block;line-height:1.6}}
</style>
</head>
<body>
<header class="site-header"><div class="container header-inner"><a class="logo" href="index.html"><span class="league-name">KNL 리그</span></a><nav class="main-nav"><ul><li class="has-dropdown"><a href="schedule.html">일정 · 결과</a><ul class="dropdown"><li><a href="schedule.html">경기일정 · 결과</a></li><li><a href="gamecenter.html">게임센터</a></li><li><a href="scoreboard.html">스코어보드</a></li></ul></li><li><a href="standings.html" class="active">순위</a></li><li><a href="index.html#news">뉴스</a></li><li><a href="index.html#teams">팀</a></li></ul></nav></div></header>
<main class="container page-wrap"><aside class="page-sidebar"><div class="side-title">순위</div><nav class="side-menu"><a href="standings.html" class="active">리그 순위</a><a href="index.html#teams">팀 소개</a></nav></aside>
<section class="page-content standings-page">
<div class="standings-title"><h1>순위</h1><div class="standings-title-right"><span>홈 &gt; 순위</span><div class="calendar-wrap"><button class="calendar-link" id="calendar-toggle">▣ 캘린더</button><div class="calendar-pop" id="calendar-pop"><div class="calendar-pop-head"><button class="calendar-nav" id="cal-prev">‹</button><span class="calendar-pop-title" id="cal-title"></span><button class="calendar-nav" id="cal-next">›</button></div><div class="calendar-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar-days" id="calendar-days"></div></div></div></div></div>
<div class="date-bar"><button class="date-arrow" id="prev-date">‹</button><div class="date-label" id="date-label"></div><button class="date-arrow" id="next-date">›</button></div>
<div class="season-row"><select class="season-select" id="season"><option value="S5">S5</option></select></div>
<div class="standings-card"><table class="standings-table"><thead><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>패</th><th>승률</th><th>R</th><th>RA</th><th>RD</th></tr></thead><tbody id="standings-body"></tbody></table></div>
<div class="standings-note"><span>S5 · 정규시즌</span><span id="sort-note">승률 → 득실차 순으로 정렬</span></div>
</section></main>
<script>
const days=['일','월','화','수','목','금','토'];
const data={S5:[{team:'NC',mark:'NC',cls:'nc',g:0,w:0,l:0,pct:'.000',r:0,ra:0,rd:0},{team:'KT',mark:'KT',cls:'kt',g:0,w:0,l:0,pct:'.000',r:0,ra:0,rd:0}]};
const body=document.getElementById('standings-body'),dateLabel=document.getElementById('date-label'),calendarPop=document.getElementById('calendar-pop'),calendarDays=document.getElementById('calendar-days'),calTitle=document.getElementById('cal-title');
function kstToday(){const s=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
let selectedDate=kstToday(),calendarDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function renderDate(){dateLabel.textContent=selectedDate.getFullYear()+'.'+String(selectedDate.getMonth()+1).padStart(2,'0')+'.'+String(selectedDate.getDate()).padStart(2,'0')+'('+days[selectedDate.getDay()]+')';renderCalendar()}
function renderCalendar(){const y=calendarDate.getFullYear(),m=calendarDate.getMonth();calTitle.textContent=y+'.'+String(m+1).padStart(2,'0');const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),today=dateKey(kstToday()),sel=dateKey(selectedDate);let h='';for(let i=0;i<first;i++)h+='<button class="empty" disabled></button>';for(let d=1;d<=last;d++){const dt=new Date(y,m,d),k=dateKey(dt),cls=(k===today?' today':'')+(k===sel?' selected':'');h+='<button class="'+cls.trim()+'" data-date="'+k+'">'+d+'</button>'}calendarDays.innerHTML=h;calendarDays.querySelectorAll('button[data-date]').forEach(b=>b.onclick=()=>{const [yy,mm,dd]=b.dataset.date.split('-').map(Number);selectedDate=new Date(yy,mm-1,dd);calendarDate=new Date(yy,mm-1,1);calendarPop.classList.remove('open');renderDate()})}
function render(){let rows=data.S5.slice().sort((a,b)=>b.w/(b.w+b.l||1)-a.w/(a.w+b.l||1)||b.rd-a.rd);body.innerHTML=rows.map((x,i)=>`<tr><td class="rank-number">${i+1}</td><td><span class="rank-team"><span class="team-mark ${x.cls}">${x.mark}</span>${x.team}</span></td><td>${x.g}</td><td class="positive">${x.w}</td><td class="negative">${x.l}</td><td class="win-rate">${x.pct}</td><td>${x.r}</td><td>${x.ra}</td><td class="${x.rd>=0?'positive':'negative'}">${x.rd>0?'+'+x.rd:x.rd}</td></tr>`).join('')}
document.getElementById('prev-date').onclick=()=>{selectedDate.setDate(selectedDate.getDate()-1);calendarDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);renderDate()};document.getElementById('next-date').onclick=()=>{selectedDate.setDate(selectedDate.getDate()+1);calendarDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1);renderDate()};document.getElementById('calendar-toggle').onclick=e=>{e.stopPropagation();calendarPop.classList.toggle('open');renderCalendar()};document.getElementById('cal-prev').onclick=e=>{e.stopPropagation();calendarDate.setMonth(calendarDate.getMonth()-1);renderCalendar()};document.getElementById('cal-next').onclick=e=>{e.stopPropagation();calendarDate.setMonth(calendarDate.getMonth()+1);renderCalendar()};document.addEventListener('click',e=>{if(!e.target.closest('.calendar-wrap'))calendarPop.classList.remove('open')});renderDate();render();
</script></body></html>
